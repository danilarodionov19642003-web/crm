<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TEST proxy dropdown</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="pages/client/client.css"/>
</head>
<body class="cli-body">
  <div class="cli-wrap" style="max-width:560px;margin:24px auto;padding:0 16px">
    <h2 class="cli-section-title">Прокси для Telegram</h2>
    <div class="cli-proxy-block" data-cli-proxies></div>
    <h2 class="cli-section-title" style="margin-top:20px">Мои анкеты</h2>
    <div style="color:var(--text-mute);font-size:13px">…контент кабинета (для оценки, сколько места освободилось)…</div>
  </div>
  <script>
    // та же разметка, что генерирует client-app.js renderProxies()
    const proxies = Array.from({length: 10}, (_, i) => ({
      host: 'proxy' + (i+1) + '.example.org', port: 443 + i, latency_ms: 120 + i*37, tg_link: '#'
    }));
    const updated = '5 мин назад';
    document.querySelector('[data-cli-proxies]').innerHTML = `
      <details class="cli-proxy-dd">
        <summary class="cli-proxy-summary">
          <span class="cli-proxy-summary__icon">🛰️</span>
          <span class="cli-proxy-summary__label">Показать прокси <b>(${proxies.length})</b></span>
          <span class="cli-proxy-summary__meta">обновлено ${updated}</span>
          <span class="cli-proxy-summary__chev">▾</span>
        </summary>
        <div class="cli-proxy-info">
          Если Telegram не открывается — нажми на любой прокси ниже. Telegram сам подставит настройки.
          Если не получилось через один — попробуй другой (некоторые могут не работать на твоём операторе).
        </div>
        <div class="cli-proxy-list">
          ${proxies.map((p, i) => `
            <a class="cli-proxy-item" href="${p.tg_link}">
              <div class="cli-proxy-num">${i + 1}</div>
              <div class="cli-proxy-body">
                <div class="cli-proxy-host">${p.host}:${p.port}</div>
                <div class="cli-proxy-meta">⚡ ${p.latency_ms} ms · открыть в Telegram</div>
              </div>
              <div class="cli-proxy-arrow">→</div>
            </a>
          `).join('')}
        </div>
        <div style="font-size:11px;color:var(--text-mute);margin-top:10px;text-align:center">
          Если ни один не работает — напиши менеджеру.
        </div>
      </details>
    `;
  </script>
</body>
</html>
