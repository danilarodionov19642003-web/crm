<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://mentori.tech https://*.supabase.co https://mentori-tg.rubicon1326.workers.dev https://*.lte-center.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b0b0c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mentori CRM"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=20260820"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=20260820"/>
  <link rel="manifest" href="/manifest.webmanifest?v=20260820"/>
  <title>Вход — Mentori</title>
  <link rel="stylesheet" href="../../css/styles.css?v=20260628a"/>
  <link rel="stylesheet" href="employee.css"/>
</head>
<body class="emp-body">
  <main class="emp-login">
    <div class="emp-login__card">
      <div class="emp-login__brand">
        <div class="emp-login__logo">M</div>
        <div>
          <h1>Mentori</h1>
          <p>Вход для сотрудника</p>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" class="input" autocomplete="username" placeholder="employee@mentori.local"/>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" class="input" autocomplete="current-password" placeholder="••••••••"/>
      </div>

      <button id="btnLogin" class="btn btn--primary" style="width:100%">Войти</button>
      <p style="margin:12px 0 0;text-align:center;font-size:11px;line-height:1.5;color:var(--text-mute,#888)">
        Нажимая «Войти», вы подтверждаете ознакомление с
        <a href="../../legal/privacy.html" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Политикой конфиденциальности</a>
        и <a href="../../legal/offer.html" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Публичной офертой</a>.
      </p>
      <div id="err" class="emp-login__err" hidden></div>
    </div>
  </main>

  <script src="../../js/supabase-client.js?v=20260820d"></script>
  <script>
  (async () => {
    const { Auth } = window.Supabase;

    // Куда редиректить после успешного входа: владельцу — главная CRM,
    // сотруднику — страница аккаунтов. Для обратной совместимости
    // можно указать ?next=... (напр. если auth-gate заслал сюда).
    function landing() {
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      if (next && /^[/]/.test(next)) return next;
      const role = Auth.role();
      return role === 'team' ? '../statuses.html' : '../../index.html';
    }

    // Восстановим сессию и при необходимости обновим протухший access_token.
    const restored = Auth.ensureFresh ? await Auth.ensureFresh() : await Auth.refresh();
    if (restored) { location.replace(landing()); return; }

    const err = document.getElementById('err');
    function showErr(msg) { err.textContent = msg; err.hidden = false; }

    async function submit() {
      err.hidden = true;
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pwd   = document.getElementById('password').value;
      if (!email || !pwd) return showErr('Введите email и пароль');

      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = 'Входим…';
      try {
        await Auth.signIn(email, pwd);
        location.replace(landing());
      } catch (e) {
        showErr(e.message || 'Не удалось войти');
        btn.disabled = false; btn.textContent = 'Войти';
      }
    }

    document.getElementById('btnLogin').addEventListener('click', submit);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    document.getElementById('email').addEventListener('keydown',    e => { if (e.key === 'Enter') submit(); });
  })();
  </script>
</body>
</html>
