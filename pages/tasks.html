<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://mentori.tech https://*.supabase.co https://mentori-tg.rubicon1326.workers.dev https://*.lte-center.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b0b0c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mentori CRM"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=20260820"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=20260820"/>
  <link rel="manifest" href="/manifest.webmanifest?v=20260820"/>
  <title>Задачи — Mentori CRM</title>
  <link rel="stylesheet" href="../css/styles.css?v=20260820b"/>
  <style>
    .task-list { display:flex; flex-direction:column; gap:8px; }
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
      transition: border-color .15s, opacity .15s;
    }
    .task-card.done { opacity: .55; }
    .task-card.done .task-note { text-decoration: line-through; }
    .task-check {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.02);
      transition: background .15s, border-color .15s;
    }
    .task-check:hover { border-color: var(--accent); }
    .task-card.done .task-check {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .task-card.done .task-check::after { content: '✓'; font-weight: 700; }
    .task-system-icon {
      width: 22px; height: 22px;
      display:inline-flex; align-items:center; justify-content:center;
      color:var(--accent); flex-shrink:0;
    }
    .task-card--system { border-left:3px solid var(--accent); }
    .task-card--client-request { border-left:3px solid #22c55e; }
    .task-meta { display:flex; flex-direction:column; gap:4px; min-width:0; }
    .task-row1 { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .task-pill {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600;
    }
    .task-pill--client { background: rgba(249,115,22,0.15); color: var(--orange); }
    .task-pill--acc    { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .task-pill--manager{ background: rgba(34,197,94,0.14); color: #4ade80; }
    .task-pill--date   { background: rgba(255,255,255,0.04); color: var(--text-mute); }
    .task-pill--overdue{ background: rgba(239,68,68,0.15); color: var(--red); }
    .task-pill--today  { background: rgba(34,197,94,0.18); color: #4ade80; }
    .task-pill--planned{ background: rgba(168,85,247,0.15); color: #c4b5fd; }
    .task-pill--request{ background: rgba(34,197,94,0.14); color: #4ade80; }
    .task-client-preview {
      border: 0; font: inherit; cursor: zoom-in; text-align: left;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .task-client-preview:hover { background: rgba(249,115,22,0.24); color: #ffad73; }
    .task-client-preview:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .task-note { color: var(--text); font-size: 14px; line-height: 1.4; word-break: break-word; }
    .task-actions { display:flex; gap:6px; flex-shrink:0; }
    .task-actions button { padding: 4px 8px; font-size: 12px; }
    .task-open { padding:4px 9px; font-size:12px; text-decoration:none; white-space:nowrap; }
    .task-schedule { white-space: nowrap; }
    .task-schedule-context {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
      padding: 10px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg); margin-bottom: 14px;
    }
    .task-schedule-context__item { min-width: 0; }
    .task-schedule-context__label { color: var(--text-mute); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .task-schedule-context__value { margin-top: 3px; font-size: 13px; overflow-wrap: anywhere; }
    .task-empty { padding:30px; text-align:center; color:var(--text-mute); }
    .task-group-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--text-mute); margin: 18px 0 6px 4px; font-weight: 600;
    }
    .task-group-title:first-child { margin-top: 0; }

    .publication-queue {
      margin-bottom: 20px; padding: 0;
    }
    .publication-queue[hidden] { display: none !important; }
    .publication-queue__head {
      display: flex; align-items: center; gap: 9px; margin-bottom: 9px;
    }
    .publication-queue__head h2 { margin: 0; font-size: 15px; }
    .publication-queue__count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
      background: rgba(34,197,94,.14); color: #4ade80; font-size: 11px; font-weight: 800;
    }
    .publication-queue__list { display: grid; gap: 8px; }
    .publication-request {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
      padding: 12px 14px; border: 1px solid rgba(34,197,94,.32); border-radius: 8px;
      background: linear-gradient(100deg, rgba(34,197,94,.08), transparent 52%), var(--bg-elev);
    }
    .publication-request__main { min-width: 0; }
    .publication-request__title { font-size: 13px; font-weight: 750; overflow-wrap: anywhere; }
    .publication-request__meta {
      display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 5px;
      color: var(--text-mute); font-size: 11px;
    }
    .publication-request__date { color: #4ade80; font-weight: 750; }
    .publication-request__actions { display: flex; gap: 6px; }
    .publication-request__actions .btn { white-space: nowrap; }

    /* ───── Агрегированный календарь по всем клиентам ───── */
    .sched-wrap {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 22px;
    }
    .sched-head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
    }
    .sched-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .sched-head .spacer { flex: 1; }
    .sched-nav-btn {
      width: 30px; height: 30px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text); border-radius: 999px;
      font-size: 16px; line-height: 1; cursor: pointer;
      transition: all .15s;
    }
    .sched-nav-btn:hover { border-color: var(--accent, #ff7a00); color: var(--accent, #ff7a00); }
    .sched-month-label { font-weight: 600; font-size: 14px; min-width: 130px; text-align: center; }
    .sched-today-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-mute); font-size: 11px;
      padding: 5px 12px; border-radius: 999px; cursor: pointer;
    }
    .sched-today-btn:hover { border-color: var(--accent, #ff7a00); color: var(--accent, #ff7a00); }

    .sched-summary {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin-bottom: 14px;
    }
    .sched-stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .sched-stat__label {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--text-mute); font-weight: 600;
    }
    .sched-stat__value { font-size: 20px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .sched-stat__sub { font-size: 11px; color: var(--text-mute); margin-top: 2px; }
    .sched-stat--today { border-color: rgba(255,122,0,0.35); background: linear-gradient(180deg, rgba(255,122,0,0.06), transparent 70%), var(--bg); }
    .sched-stat--today .sched-stat__value { color: var(--accent, #ff7a00); }

    .sched-weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
      font-size: 10px; color: var(--text-mute);
      text-transform: uppercase; letter-spacing: .08em;
      text-align: center; font-weight: 600;
      margin-bottom: 6px;
    }
    .sched-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .sched-cell {
      position: relative; min-height: 64px;
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer; color: var(--text); font-family: inherit;
      padding: 6px 6px 4px; text-align: left;
      transition: background .12s, transform .12s;
    }
    .sched-cell:hover { background: var(--bg-elev-2, rgba(255,255,255,0.04)); transform: scale(1.02); }
    .sched-cell--empty { background: transparent; cursor: default; pointer-events: none; }
    .sched-cell.is-today { border-color: var(--accent, #ff7a00); }
    .sched-cell.is-today .sched-cell__day { color: var(--accent, #ff7a00); font-weight: 800; }
    .sched-cell.is-selected {
      background: linear-gradient(135deg, rgba(255,122,0,0.18), rgba(255,154,60,0.08));
      border-color: var(--accent, #ff7a00);
    }
    .sched-cell.has-plan { background: rgba(255,122,0,0.06); border-color: rgba(255,122,0,0.22); }
    .sched-cell.has-task { border-color: rgba(168,85,247,0.38); box-shadow: inset 0 0 0 1px rgba(168,85,247,0.08); }
    .sched-cell__day { font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .sched-cell__count {
      position: absolute; top: 4px; right: 5px;
      background: rgba(255,122,0,0.18); color: var(--accent, #ff7a00);
      font-size: 10px; font-weight: 800; line-height: 1;
      padding: 3px 7px; border-radius: 999px;
    }
    .sched-cell__task-count {
      position: absolute; bottom: 4px; right: 5px;
      background: rgba(168,85,247,0.18); color: #c4b5fd;
      font-size: 9px; font-weight: 800; line-height: 1;
      padding: 3px 6px; border-radius: 999px;
    }
    .sched-cell__task-count[data-tone="done"] {
      background: rgba(34,197,94,0.14); color: #22c55e;
    }
    .sched-cell__dots {
      position: absolute; bottom: 4px; left: 6px; right: 6px;
      display: flex; gap: 2px; flex-wrap: wrap;
    }
    .sched-cell__dot {
      width: 6px; height: 6px; border-radius: 50%;
      flex-shrink: 0;
    }
    .sched-day-detail {
      margin-top: 16px; padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .sched-day-detail__title {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 13px; margin-bottom: 10px;
    }
    .sched-day-detail__meta {
      background: var(--bg); padding: 3px 9px; border-radius: 999px;
      font-size: 10px; font-weight: 600; color: var(--text-mute);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .sched-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 6px;
    }
    .sched-row__dot {
      width: 12px; height: 12px; border-radius: 50%;
      flex-shrink: 0;
    }
    .sched-row__name {
      flex: 1; min-width: 0;
      font-size: 13px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    button.sched-row__name {
      border: 0; background: transparent; color: inherit; font-family: inherit;
      padding: 0; cursor: zoom-in; text-align: left;
    }
    button.sched-row__name:hover strong { color: var(--accent, #ff7a00); }
    button.sched-row__name:focus-visible {
      outline: 2px solid var(--accent, #ff7a00); outline-offset: 4px; border-radius: 4px;
    }
    .sched-row__count {
      font-size: 12px; font-weight: 700; color: var(--accent, #ff7a00);
      font-variant-numeric: tabular-nums;
      background: rgba(255,122,0,0.12); padding: 3px 9px; border-radius: 999px;
    }
    .sched-row__progress {
      font-size: 11px; color: var(--text-mute);
      font-variant-numeric: tabular-nums;
    }
    .task-photo-view { display: grid; gap: 12px; justify-items: center; }
    .task-photo-view__frame {
      width: min(100%, 360px); aspect-ratio: 1;
      display: grid; place-items: center; overflow: hidden;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg);
    }
    .task-photo-view__frame img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .task-photo-view__empty {
      padding: 24px; color: var(--text-mute); font-size: 13px; text-align: center;
    }
    .task-photo-view__meta { color: var(--text-mute); font-size: 12px; text-align: center; }
    .sched-row__link {
      font-size: 11px; padding: 4px 10px;
      border-radius: 999px; background: transparent;
      border: 1px solid var(--border); color: var(--text-mute);
      cursor: pointer; transition: all .15s;
      text-decoration: none;
    }
    .sched-row__link:hover { border-color: var(--accent, #ff7a00); color: var(--accent, #ff7a00); }
    .sched-row__resp {
      font-size: 11px; padding: 3px 9px; border-radius: 999px;
      font-weight: 600; flex-shrink: 0;
    }
    .sched-row__resp[data-tone="pos"]  { background: rgba(34,197,94,0.12);  color: #22c55e; }
    .sched-row__resp[data-tone="neg"]  { background: rgba(239,68,68,0.12);  color: #ef4444; }
    .sched-row__resp[data-tone="mute"] { background: rgba(160,160,160,0.12); color: var(--text-mute); }
    .sched-row.is-done { background: rgba(34,197,94,0.07); }
    .sched-row.is-done .sched-row__name strong { color: #22c55e; }
    .sched-row--task { border-color: rgba(168,85,247,0.26); }
    .sched-row--task .sched-row__dot { border-radius: 3px; }
    .sched-row__task-label {
      font-size: 10px; font-weight: 700; color: #c4b5fd;
      background: rgba(168,85,247,0.14); padding: 3px 8px; border-radius: 999px;
      white-space: nowrap;
    }
    .sched-empty-day {
      padding: 18px; text-align: center; color: var(--text-mute);
      font-size: 12px; font-style: italic;
      background: var(--bg); border-radius: 14px;
    }
    @media (max-width: 600px) {
      .sched-summary { grid-template-columns: repeat(2, 1fr); }
      .sched-cell { min-height: 54px; }
      .task-card { grid-template-columns: auto 1fr; }
      .task-actions { grid-column: 2; flex-wrap: wrap; }
      .task-schedule-context { grid-template-columns: 1fr; }
      .sched-row { flex-wrap: wrap; }
      .sched-row__link { margin-left: 24px; }
      .publication-request { grid-template-columns: minmax(0, 1fr); }
      .publication-request__actions { width: 100%; }
      .publication-request__actions .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div data-component="sidebar" data-active="tasks"></div>

    <div class="main">
      <div data-component="header" data-title="Задачи"></div>

      <main class="content">
        <div class="page-title">
          <div>
            <h1>Задачи на день</h1>
            <p id="pageSubtitle">С какого аккаунта работать с каким клиентом сегодня.</p>
          </div>
          <button class="btn btn--primary" id="btnAdd" data-owner-only style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Новая задача
          </button>
        </div>

        <section class="publication-queue" id="publicationQueue" data-owner-only style="display:none" hidden>
          <div class="publication-queue__head">
            <h2>Запросы клиентов на публикацию</h2>
            <span class="publication-queue__count" id="publicationQueueCount">0</span>
          </div>
          <div class="publication-queue__list" id="publicationQueueList"></div>
        </section>

        <!-- ───── Агрегированный календарь по всем клиентам ───── -->
        <div class="sched-wrap" data-owner-only style="display:none">
          <div class="sched-head">
            <h2>📅 План отзывов и задач</h2>
            <div class="spacer"></div>
            <button class="sched-nav-btn" id="schedPrev">‹</button>
            <div class="sched-month-label" id="schedMonth">—</div>
            <button class="sched-nav-btn" id="schedNext">›</button>
            <button class="sched-today-btn" id="schedToday">сегодня</button>
          </div>

          <div class="sched-summary" id="schedSummary"></div>
          <div class="sched-weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
          </div>
          <div class="sched-grid" id="schedGrid"></div>

          <div class="sched-day-detail" id="schedDayDetail"></div>
        </div>

        <section class="cards" id="taskKpis"></section>

        <div class="filters">
          <select id="fScope" class="select">
            <option value="today">Сегодня и просроченные</option>
            <option value="upcoming">Предстоящие</option>
            <option value="overdue">Просрочены</option>
            <option value="done">Выполненные</option>
            <option value="all">Все</option>
          </select>
          <select id="fManager" class="select">
            <option value="">Все менеджеры</option>
            <option value="Илья">Илья</option>
            <option value="Данил">Данил</option>
            <option value="__none__">Не назначен</option>
          </select>
          <select id="fMentor" class="select">
            <option value="">Все клиенты</option>
          </select>
          <input type="text" id="fSearch" class="input" placeholder="Поиск по тексту задачи..." style="flex:1;min-width:200px"/>
          <button class="btn btn--ghost" id="btnReset">Сбросить</button>
        </div>

        <div class="task-list" id="taskList"></div>
      </main>
    </div>
  </div>

  <!-- Модалка добавления / редактирования (только владелец) -->
  <div class="modal-backdrop" id="taskModal">
    <div class="modal" style="max-width:520px">
      <div class="modal__header">
        <h3 id="taskTitle">Новая задача</h3>
        <button class="btn--icon" data-close>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="field-row">
          <div class="field"><label for="tDate">Дата</label>
            <input type="date" id="tDate" class="input"/>
          </div>
          <div class="field"><label for="tMentor">Клиент</label>
            <select id="tMentor" class="select"></select>
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="tProfile">Аккаунт (с какого работать)</label>
          <select id="tProfile" class="select"></select>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="tNote">Что сделать</label>
          <textarea id="tNote" class="input" rows="3" placeholder="Например: написать диалог, подвести к выбору, опубликовать отзыв" style="resize:vertical;min-height:70px;font-family:inherit"></textarea>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" id="tDelete" style="color:var(--red);display:none">🗑 Удалить</button>
        <div style="flex:1"></div>
        <button class="btn btn--ghost" data-close>Отмена</button>
        <button class="btn btn--primary" id="tSave">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Перенос системной задачи, созданной сроком следующего статуса -->
  <div class="modal-backdrop" id="statusScheduleModal">
    <div class="modal" style="max-width:480px">
      <div class="modal__header">
        <h3>Запланировать задачу</h3>
        <button class="btn--icon" data-close aria-label="Закрыть">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="task-schedule-context" id="statusScheduleContext"></div>
        <div class="field">
          <label for="statusScheduleDate">Когда выполнить</label>
          <input type="date" id="statusScheduleDate" class="input"/>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" data-close>Отмена</button>
        <button class="btn btn--primary" id="statusScheduleSave">Запланировать</button>
      </div>
    </div>
  </div>

  <!-- Быстрый просмотр фотографии анкеты без ухода со страницы задач -->
  <div class="modal-backdrop" id="clientPhotoModal">
    <div class="modal" style="max-width:460px" role="dialog" aria-modal="true" aria-labelledby="clientPhotoTitle">
      <div class="modal__header">
        <h3 id="clientPhotoTitle">Фото анкеты</h3>
        <button class="btn--icon" type="button" data-close aria-label="Закрыть">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="task-photo-view">
          <div class="task-photo-view__frame">
            <img id="clientPhotoImage" alt="" referrerpolicy="no-referrer" hidden/>
            <div class="task-photo-view__empty" id="clientPhotoEmpty">Загрузка фотографии...</div>
          </div>
          <div class="task-photo-view__meta" id="clientPhotoMeta"></div>
        </div>
      </div>
      <div class="modal__footer">
        <a class="btn btn--ghost" id="clientPhotoProfileLink" href="#" target="_blank" rel="noopener" hidden>Открыть анкету Profi.ru</a>
        <button class="btn btn--primary" type="button" data-close>Закрыть</button>
      </div>
    </div>
  </div>

  <script src="../data/seed.js"></script>
  <script src="../js/app.js?v=20260820i"></script>
  <script src="../js/supabase-client.js?v=20260820d"></script>
  <script src="../js/auth-gate.js?v=20260726a"></script>
  <script src="../js/cloud-sync.js?v=20260820d"></script>
  <script src="../js/reviews-sync.js?v=20260717a"></script>
  <script src="../js/outreach-schedule-sync.js?v=20260820a"></script>
  <script src="../js/schedule-apply.js?v=20260522b"></script>
  <script src="../components/sidebar.js?v=20260820b"></script>
  <script src="../components/header.js"></script>
  <script src="../components/table.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const { Store, Modal, toast, todayISO, fmtDate, clientScheduleBreakdown, STATUS_CHOSEN } = window.App;
    const { confirmDelete } = window.TableUtils;

    Store.load();
    const isOwner = (window.AuthGate && window.AuthGate.isOwner && window.AuthGate.isOwner()) || false;
    if (isOwner) document.querySelectorAll('[data-owner-only]').forEach(el => el.style.display = '');

    const filters = { scope: 'today', manager: '', mentorId: '', q: '' };
    let editingId = null;
    let schedulingStatusId = null;
    let publicationRequests = [];
    const resolvingPublicationIds = new Set();
    let publicationSnapshotsRefreshed = false;

    function escapeHtml(s) {
      return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function safeProfiAvatarUrl(value) {
      try {
        const url = new URL(String(value || ''));
        return url.protocol === 'https:' && url.hostname === 'cdn.profi.ru'
          && url.pathname.startsWith('/xfiles/pfiles/') ? url.href : '';
      } catch (_) { return ''; }
    }

    function safeProfiProfileUrl(value) {
      try {
        const url = new URL(String(value || ''));
        return url.protocol === 'https:' && ['profi.ru', 'www.profi.ru'].includes(url.hostname)
          && /^\/profile\/[A-Za-z0-9_-]+\/?$/.test(url.pathname) ? url.href : '';
      } catch (_) { return ''; }
    }

    function mentorById(id) { return (Store.state.mentors || []).find(m => m.id === id) || null; }
    function clientByMentorId(id) {
      const mentor = mentorById(id);
      const code = String(mentor && mentor.code || '').toLowerCase().replace(/[\s-]+/g, '');
      if (!code) return null;
      return (Store.state.clients || []).find(c => String(c.code || '').toLowerCase().replace(/[\s-]+/g, '') === code) || null;
    }
    function managerForMentor(id) {
      const client = clientByMentorId(id);
      return client ? String(client.manager || '').trim() : '';
    }
    function matchesManager(manager) {
      if (!filters.manager) return true;
      return filters.manager === '__none__' ? !manager : manager === filters.manager;
    }
    function profileById(id) {
      const live = (Store.state.profiles || []).find(p => p.id === id);
      if (live) return live;
      const dead = (Store.state.archivedProfiles || []).find(p => p.id === id);
      return dead ? Object.assign({}, dead, { archived: true }) : null;
    }
    function mentorLabel(m) { return m ? `${m.code || '?'}${m.name ? ' — ' + m.name : ''}` : '—'; }
    function profileLabel(p) {
      if (!p) return '—';
      const base = `${p.code || '—'}${p.city ? ' · ' + p.city : ''}`;
      return p.archived ? `🗑 ${base}` : base;
    }

    function clientPhotoTriggerHtml(mentorId, content, className) {
      if (!mentorId) return `<div class="${className}">${content}</div>`;
      return `<button type="button" class="${className} task-client-preview" data-client-photo="${escapeHtml(mentorId)}" title="Показать фотографию анкеты">${content}</button>`;
    }

    function openClientPhoto(mentorId) {
      const mentor = mentorById(mentorId);
      const client = clientByMentorId(mentorId);
      if (!mentor && !client) return;

      const code = String((client && client.code) || (mentor && mentor.code) || '').trim();
      const name = String((client && client.name) || (mentor && mentor.name) || '').trim();
      const title = [code, name].filter(Boolean).join(' · ') || 'Фото анкеты';
      const avatarUrl = safeProfiAvatarUrl(
        (client && client.avatarUrl) || (mentor && mentor.avatarUrl) || ''
      );
      const profileUrl = safeProfiProfileUrl(
        (client && client.profileUrl) || (mentor && mentor.profileUrl) || ''
      );
      const image = document.getElementById('clientPhotoImage');
      const empty = document.getElementById('clientPhotoEmpty');
      const profileLink = document.getElementById('clientPhotoProfileLink');

      document.getElementById('clientPhotoTitle').textContent = title;
      document.getElementById('clientPhotoMeta').textContent = 'Фотография из публичной анкеты Profi.ru';
      image.hidden = true;
      image.removeAttribute('src');
      image.alt = `Фото анкеты ${title}`;
      empty.hidden = false;
      empty.textContent = avatarUrl ? 'Загрузка фотографии...' : 'Фотография для этой анкеты пока не загружена.';
      profileLink.hidden = !profileUrl;
      profileLink.href = profileUrl || '#';

      if (avatarUrl) {
        image.onload = () => {
          image.hidden = false;
          empty.hidden = true;
        };
        image.onerror = () => {
          image.hidden = true;
          empty.hidden = false;
          empty.textContent = 'Не удалось загрузить фотографию. Попробуйте открыть анкету Profi.ru.';
        };
        image.src = avatarUrl;
      }
      Modal.open('clientPhotoModal');
    }

    document.addEventListener('click', event => {
      const trigger = event.target.closest('[data-client-photo]');
      if (!trigger) return;
      event.preventDefault();
      openClientPhoto(trigger.dataset.clientPhoto);
    });

    function publicationRequestTask(request) {
      return {
        id: `client-publication-request:${request.id}`,
        source: 'client_publication_request',
        requestId: request.id,
        requestStatus: request.request_status,
        statusId: request.status_id,
        mentorId: request.mentor_id,
        profileId: request.profile_id,
        date: request.requested_date,
        requestedDate: request.requested_date,
        clientEmail: request.client_email || '',
        accountOwner: request.account_name || '',
        note: 'Клиент выбрал дату публикации отзыва',
        manager: managerForMentor(request.mentor_id),
        done: false,
        createdAt: request.created_at || request.updated_at || ''
      };
    }

    async function loadPublicationRequests() {
      try {
        const S = window.Supabase;
        if (!S || !S.authFetch) return [];
        const url = `${S.URL}/rest/v1/client_publication_requests`
          + '?request_status=eq.pending'
          + '&select=id,client_email,status_id,mentor_id,profile_id,anketa_code,anketa_name,account_name,requested_date,request_status,created_at,updated_at'
          + '&order=created_at.asc';
        const res = await S.authFetch(url, {
          headers: { 'apikey': S.KEY, 'Accept': 'application/json' }
        });
        if (!res.ok) {
          console.warn('[tasks] publication requests fetch failed', res.status);
          return publicationRequests;
        }
        return await res.json();
      } catch (error) {
        console.warn('[tasks] publication requests fetch error', error);
        return publicationRequests;
      }
    }

    async function resolvePublicationRequestOnServer(id, accepted) {
      const S = window.Supabase;
      if (!S || !S.authFetch) throw new Error('NO_CONNECTION');
      const res = await S.authFetch(`${S.URL}/rest/v1/rpc/resolve_client_publication_request`, {
        method: 'POST',
        headers: { 'apikey': S.KEY, 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ p_request_id: Number(id), p_accept: !!accepted })
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        const error = new Error(String(body.message || body.details || `HTTP ${res.status}`));
        error.status = res.status;
        throw error;
      }
      return body;
    }

    async function resolvePublicationRequest(id, accepted) {
      const request = publicationRequests.find(item => String(item.id) === String(id));
      if (!request || resolvingPublicationIds.has(String(id))) return;
      resolvingPublicationIds.add(String(id));
      renderPublicationQueue();
      try {
        await resolvePublicationRequestOnServer(request.id, accepted);
        if (accepted && window.CloudSync && window.CloudSync.pull) {
          await window.CloudSync.pull({ silent: true });
        }
        publicationRequests = await loadPublicationRequests();
        toast(accepted
          ? `Дата ${fmtDate(request.requested_date)} подтверждена и добавлена в календарь`
          : 'Запрос клиента отклонён');
      } catch (error) {
        const raw = String(error && error.message || '');
        const message = raw.includes('STATUS_NOT_AVAILABLE')
          ? 'Статус аккаунта уже изменился. Запрос нельзя подтвердить.'
          : raw.includes('REQUEST_ALREADY_RESOLVED')
            ? 'Этот запрос уже обработан. Обновляю список.'
            : 'Не удалось обработать запрос. Проверь связь и попробуй ещё раз.';
        toast(message, 'error');
        publicationRequests = await loadPublicationRequests();
      } finally {
        resolvingPublicationIds.delete(String(id));
      }
      render();
      renderSched();
    }

    function renderPublicationQueue() {
      const section = document.getElementById('publicationQueue');
      const list = document.getElementById('publicationQueueList');
      const count = document.getElementById('publicationQueueCount');
      if (!section || !list || !count) return;
      const rows = publicationRequests.filter(request => request.request_status === 'pending');
      section.hidden = !isOwner || !rows.length;
      if (!isOwner || !rows.length) {
        list.innerHTML = '';
        count.textContent = '0';
        return;
      }
      count.textContent = String(rows.length);
      list.innerHTML = rows.map(request => {
        const mentor = mentorById(request.mentor_id);
        const profile = profileById(request.profile_id);
        const busy = resolvingPublicationIds.has(String(request.id));
        const clientLabel = mentorLabel(mentor) !== '—'
          ? mentorLabel(mentor)
          : `${request.anketa_code || '—'}${request.anketa_name ? ' — ' + request.anketa_name : ''}`;
        const accountLabel = profile ? profileLabel(profile) : (request.account_name || '—');
        return `
          <article class="publication-request">
            <div class="publication-request__main">
              ${clientPhotoTriggerHtml(request.mentor_id, escapeHtml(clientLabel), 'publication-request__title')}
              <div class="publication-request__meta">
                <span>Аккаунт: ${escapeHtml(accountLabel)}</span>
                <span class="publication-request__date">Публикация: ${escapeHtml(fmtDate(request.requested_date))}</span>
              </div>
            </div>
            <div class="publication-request__actions">
              <button class="btn btn--primary" type="button" data-queue-accept="${escapeHtml(request.id)}"${busy ? ' disabled' : ''}>Подтвердить</button>
              <button class="btn btn--ghost" type="button" data-queue-reject="${escapeHtml(request.id)}"${busy ? ' disabled' : ''}>Отклонить</button>
              <a class="btn btn--ghost task-open" href="statuses.html?profileId=${encodeURIComponent(request.profile_id)}&mentorId=${encodeURIComponent(request.mentor_id)}">Открыть →</a>
            </div>
          </article>`;
      }).join('');
      list.querySelectorAll('[data-queue-accept]').forEach(button => {
        button.addEventListener('click', () => resolvePublicationRequest(button.dataset.queueAccept, true));
      });
      list.querySelectorAll('[data-queue-reject]').forEach(button => {
        button.addEventListener('click', () => resolvePublicationRequest(button.dataset.queueReject, false));
      });
    }

    function fillSelects() {
      // Клиенты
      const mSel = document.getElementById('fMentor');
      const tSel = document.getElementById('tMentor');
      const mentors = (Store.state.mentors || []).slice()
        .sort((a,b) => (a.code||'').localeCompare(b.code||'', 'ru', { numeric: true }));
      const opts = mentors.map(m => `<option value="${m.id}">${escapeHtml(mentorLabel(m))}</option>`).join('');
      mSel.innerHTML = '<option value="">Все клиенты</option>' + opts;
      tSel.innerHTML = '<option value="">— выбрать клиента —</option>' + opts;
      // Аккаунты (только живые)
      const pSel = document.getElementById('tProfile');
      const profs = (Store.state.profiles || []).slice()
        .sort((a,b) => (a.code||'').localeCompare(b.code||'', 'ru', { numeric: true }));
      pSel.innerHTML = '<option value="">— любой аккаунт —</option>'
        + profs.map(p => `<option value="${p.id}">${escapeHtml(profileLabel(p))}</option>`).join('');
      // восстановим текущие значения фильтров
      mSel.value = filters.mentorId;
    }

    function isToday(iso) { return iso === todayISO(); }
    function isPast(iso) { return iso && iso < todayISO(); }
    function isFuture(iso) { return iso && iso > todayISO(); }

    function applyFilters(tasks) {
      return tasks.filter(t => {
        if (!matchesManager(t.manager || managerForMentor(t.mentorId))) return false;
        if (filters.mentorId && t.mentorId !== filters.mentorId) return false;
        if (filters.q) {
          const m = mentorById(t.mentorId);
          const p = profileById(t.profileId);
          const hay = [t.note, m && m.code, m && m.name, p && p.code].join(' ').toLowerCase();
          if (!hay.includes(filters.q)) return false;
        }
        if (t.source === 'client_publication_request') return filters.scope !== 'done';
        switch (filters.scope) {
          case 'today':    return !t.done && (isToday(t.date) || isPast(t.date));
          case 'upcoming': return !t.done && isFuture(t.date);
          case 'overdue':  return !t.done && isPast(t.date);
          case 'done':     return t.done;
          case 'all':      return true;
        }
        return true;
      });
    }

    function render() {
      fillSelects();
      const manualTasks = (Store.state.dailyTasks || []).slice();
      const statusTasks = Store.listProfileStatusActionTasks(todayISO());
      const all = manualTasks.concat(statusTasks)
        .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||'').localeCompare(b.createdAt||''));
      const filtered = applyFilters(all);
      const managerScoped = all.filter(t => matchesManager(t.manager || managerForMentor(t.mentorId)));
      renderPublicationQueue();

      // KPI
      const today = todayISO();
      const todayTasks = managerScoped.filter(t => t.date === today);
      const todayDone = todayTasks.filter(t => t.done).length;
      const overdue = managerScoped.filter(t => !t.done && isPast(t.date)).length;
      const upcoming = managerScoped.filter(t => !t.done && isFuture(t.date)).length;
      document.getElementById('taskKpis').innerHTML = `
        <div class="card"><div class="card__label">На сегодня</div><div class="card__value">${todayDone}/${todayTasks.length}</div></div>
        <div class="card"><div class="card__label">Просрочено</div><div class="card__value" style="color:var(--red)">${overdue}</div></div>
        <div class="card"><div class="card__label">Предстоит</div><div class="card__value">${upcoming}</div></div>
        <div class="card"><div class="card__label">Всего задач</div><div class="card__value">${managerScoped.length}</div></div>
      `;

      const list = document.getElementById('taskList');
      if (!filtered.length) {
        list.innerHTML = `<div class="task-empty">Задач нет. ${isOwner ? 'Нажми «Новая задача».' : 'Жди, когда владелец поставит задачу.'}</div>`;
        return;
      }
      // Группировка по дате
      const groups = new Map();
      filtered.forEach(t => {
        const k = t.date || '—';
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(t);
      });
      const html = [];
      [...groups.keys()].sort().forEach(date => {
        let title = fmtDate(date) || date;
        if (date === today) title += ' · СЕГОДНЯ';
        else if (isPast(date)) title += ' · ПРОСРОЧЕНО';
        else if (isFuture(date)) {
          const days = Math.round((new Date(date) - new Date(today)) / 86400000);
          title += ` · через ${days} дн.`;
        }
        html.push(`<div class="task-group-title">${escapeHtml(title)}</div>`);
        groups.get(date).forEach(t => html.push(taskHtml(t)));
      });
      list.innerHTML = html.join('');

      // bind
      list.querySelectorAll('.task-check[data-id]').forEach(el => {
        el.addEventListener('click', () => {
          Store.toggleDailyTask(el.dataset.id);
          render();
        });
      });
      if (isOwner) {
        list.querySelectorAll('button[data-act="edit"]').forEach(btn => {
          btn.addEventListener('click', () => openEdit(btn.dataset.id));
        });
        list.querySelectorAll('button[data-act="del"]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (!confirmDelete('Удалить задачу?')) return;
            Store.deleteDailyTask(btn.dataset.id);
            toast('Удалено');
            render();
          });
        });
      }
      list.querySelectorAll('button[data-act="schedule-system"]').forEach(btn => {
        btn.addEventListener('click', () => openStatusSchedule(btn.dataset.statusId));
      });
      list.querySelectorAll('button[data-act="accept-client-publication"]').forEach(btn => {
        btn.addEventListener('click', () => resolvePublicationRequest(btn.dataset.requestId, true));
      });
      list.querySelectorAll('button[data-act="reject-client-publication"]').forEach(btn => {
        btn.addEventListener('click', () => resolvePublicationRequest(btn.dataset.requestId, false));
      });
    }

    function taskHtml(t) {
      const m = mentorById(t.mentorId);
      const p = profileById(t.profileId);
      const manager = t.manager || managerForMentor(t.mentorId);
      const isClientRequest = t.source === 'client_publication_request';
      const isSystem = t.source === 'profile_status_action' || isClientRequest;
      const datePill = t.date === todayISO() ? 'task-pill--today'
        : (isPast(t.date) && !t.done) ? 'task-pill--overdue'
        : 'task-pill--date';
      const ownerSuffix = isSystem && t.accountOwner ? ` · ${t.accountOwner}` : '';
      const accBlock = p ? `<span class="task-pill task-pill--acc">📋 ${escapeHtml(profileLabel(p) + ownerSuffix)}</span>` : '';
      const editBtn = isOwner && !isSystem ? `<button class="btn btn--ghost" data-act="edit" data-id="${t.id}" title="Редактировать">✎</button>` : '';
      const delBtn  = isOwner && !isSystem ? `<button class="btn btn--ghost" data-act="del" data-id="${t.id}" style="color:var(--red)" title="Удалить">🗑</button>` : '';
      const openBtn = isSystem
        ? `<a class="btn btn--ghost task-open" href="statuses.html?profileId=${encodeURIComponent(t.profileId)}&mentorId=${encodeURIComponent(t.mentorId)}">Открыть →</a>`
        : '';
      const scheduleBtn = isSystem && !isClientRequest
        ? `<button class="btn btn--ghost task-schedule" data-act="schedule-system" data-status-id="${escapeHtml(t.statusId)}">📅 ${t.plannedDate ? 'Перепланировать' : 'Запланировать'}</button>`
        : '';
      const requestButtons = isClientRequest
        ? `<button class="btn btn--primary" data-act="accept-client-publication" data-request-id="${escapeHtml(t.requestId)}">Подтвердить</button>
           <button class="btn btn--ghost" data-act="reject-client-publication" data-request-id="${escapeHtml(t.requestId)}">Отклонить</button>`
        : '';
      const statusMeta = isSystem && !isClientRequest
        ? `<span class="task-pill task-pill--date">в статусе ${t.daysInStatus} дн.</span>`
        : '';
      const planMeta = isSystem && !isClientRequest && t.plannedDate
        ? `<span class="task-pill task-pill--planned">план: ${escapeHtml(fmtDate(t.plannedDate))}</span>`
        : '';
      const requestMeta = isClientRequest
        ? `<span class="task-pill task-pill--request">дата от клиента</span>`
        : '';
      return `
        <div class="task-card${t.done ? ' done' : ''}${isSystem ? ' task-card--system' : ''}${isClientRequest ? ' task-card--client-request' : ''}">
          ${isSystem ? `<div class="task-system-icon" title="${isClientRequest ? 'Запрос клиента' : 'Закроется после смены статуса'}">${isClientRequest ? '📅' : '⏱'}</div>` : `<div class="task-check" data-id="${t.id}" title="${t.done ? 'Снять выполнение' : 'Отметить выполненным'}"></div>`}
          <div class="task-meta">
            <div class="task-row1">
              <span class="task-pill ${datePill}">📅 ${escapeHtml(fmtDate(t.date) || t.date || '—')}</span>
              ${clientPhotoTriggerHtml(t.mentorId, `👤 ${escapeHtml(mentorLabel(m))}`, 'task-pill task-pill--client')}
              <span class="task-pill task-pill--manager">${escapeHtml(manager || 'не назначен')}</span>
              ${accBlock}
              ${statusMeta}
              ${planMeta}
              ${requestMeta}
            </div>
            <div class="task-note">${escapeHtml(t.note || '— без описания —')}</div>
          </div>
          <div class="task-actions">${requestButtons}${scheduleBtn}${openBtn}${editBtn}${delBtn}</div>
        </div>`;
    }

    function openStatusSchedule(statusId) {
      const task = Store.listProfileStatusActionTasks(todayISO())
        .find(item => item.statusId === statusId);
      if (!task) {
        toast('Задача уже закрыта сменой статуса', 'error');
        render();
        return;
      }
      schedulingStatusId = statusId;
      const mentor = mentorById(task.mentorId);
      const profile = profileById(task.profileId);
      const dateInput = document.getElementById('statusScheduleDate');
      const initialDate = task.plannedDate && task.plannedDate >= todayISO()
        ? task.plannedDate
        : todayISO();
      dateInput.min = todayISO();
      dateInput.value = initialDate;
      document.getElementById('statusScheduleContext').innerHTML = `
        <div class="task-schedule-context__item">
          <div class="task-schedule-context__label">Клиент</div>
          <div class="task-schedule-context__value">${escapeHtml(mentorLabel(mentor))}</div>
        </div>
        <div class="task-schedule-context__item">
          <div class="task-schedule-context__label">Аккаунт</div>
          <div class="task-schedule-context__value">${escapeHtml(profileLabel(profile))}</div>
        </div>
        <div class="task-schedule-context__item" style="grid-column:1/-1">
          <div class="task-schedule-context__label">Исходный срок</div>
          <div class="task-schedule-context__value">${escapeHtml(fmtDate(task.date))}${task.dueState === 'overdue' ? ' · просрочено' : ''}</div>
        </div>

    /* ═══════════════════════════════════════════════════════════════════
       Агрегированный календарь по всем клиентам (только для владельца).
       Собирает ВСЕ client.schedule[] записи в один календарь. Видно
       сколько отзывов в каждый день и для каких клиентов.
       Тык на день → список «кто запланирован» с быстрыми ссылками
       на график конкретного клиента.
       Дополнительно подтягиваем ответы клиентов на утренний опрос бота
       из таблицы schedule_responses (✅ согласие / ⏭ перенос / 📨 спросил).
       ═══════════════════════════════════════════════════════════════════ */
    const CAL_COLORS = ['#ff7a00','#22c55e','#3b82f6','#a855f7','#14b8a6','#eab308','#ef4444','#06b6d4'];
    const schedState = { month: new Date(), selected: todayISO(), responses: new Map() };

    // Подгружаем ответы клиентов (RLS anon SELECT на таблице schedule_responses).
    async function loadScheduleResponses() {
      try {
        if (!window.Supabase || !window.Supabase.URL || !window.Supabase.KEY) return;
        const today = new Date(); today.setHours(0,0,0,0);
        const from = new Date(today); from.setDate(from.getDate() - 30);
        const to   = new Date(today); to.setDate(to.getDate() + 60);
        const url = `${window.Supabase.URL}/rest/v1/schedule_responses` +
                    `?schedule_date=gte.${from.toISOString().slice(0,10)}` +
                    `&schedule_date=lte.${to.toISOString().slice(0,10)}` +
                    `&select=client_code,mentor_id,schedule_date,response,responded_at,notified_at,chosen_time,chosen_date` +
                    `&order=responded_at.desc.nullsfirst`;
        const res = await fetch(url, {
          headers: {
            'apikey': window.Supabase.KEY,
            'Authorization': `Bearer ${window.Supabase.KEY}`,
            'Accept': 'application/json',
          },
        });
        if (!res.ok) { console.warn('[sched] responses fetch failed', res.status); return; }
        const rows = await res.json();
        // Дедуп с учётом ПЕРЕНОСОВ:
        //   • финальный ответ с chosen_date != schedule_date «приписывается»
        //     к chosen_date (на исходной дате запись из client.schedule уже
        //     удалена через schedule-apply.js).
        //   • финальный ответ с chosen_date == schedule_date (yes без переноса)
        //     остаётся на schedule_date.
        //   • asked — на schedule_date.
        // Ключ дедупа: (mentor_id, day_anchor), где day_anchor — фактический
        // день записи в client.schedule[].
        const finals = new Map();
        const askeds = new Map();
        for (const r of rows) {
          const mid = r.mentor_id || r.client_code || '';
          if (r.response === 'yes' || r.response === 'no') {
            const anchor = r.chosen_date || r.schedule_date;
            const key = mid + '|' + anchor;
            if (!finals.has(key)) finals.set(key, r);
          } else {
            const key = mid + '|' + r.schedule_date;
            if (!askeds.has(key)) askeds.set(key, r);
          }
        }
        const map = new Map(askeds);
        for (const [k, v] of finals) map.set(k, v);        // финальный перекрывает asked
        schedState.responses = map;
      } catch (e) {
        console.warn('[sched] responses load error', e);
      }
    }
    function respLabel(resp) {
      if (resp === 'yes')     return { icon: '✅', text: 'согласен', tone: 'pos' };
      if (resp === 'no')      return { icon: '⏭',  text: 'отказ',    tone: 'neg' };
      if (resp === 'asked')   return { icon: '📨', text: 'спросили', tone: 'mute' };
      if (resp === 'pending') return { icon: '⏳', text: 'ждём',     tone: 'mute' };
      return null;
    }

    /** Собирает остаток плана и автоматически выполненные отклики по датам. */
    function collectScheduleByDate() {
      const map = new Map();
      const clients = (Store.state.clients || []).filter(c =>
        !c.closed && Array.isArray(c.schedule) && c.schedule.length && matchesManager(String(c.manager || '').trim())
      );
      // Раскрашиваем стабильно — по индексу в отсортированном списке
      const sorted = [...clients].sort((a,b) => (a.code||'').localeCompare(b.code||'','ru',{numeric:true}));
      sorted.forEach((c, idx) => {
        const color = CAL_COLORS[idx % CAL_COLORS.length];
        // Резолвим mentor.id по client.code (бот пишет в БД именно mentor_id)
        const cCode = String(c.code || '').toLowerCase().trim();
        const mentor = (Store.state.mentors || []).find(
          m => String(m.code || '').toLowerCase().trim() === cCode
        );
        const mentorId = mentor ? mentor.id : null;
        clientScheduleBreakdown(Store.state, c).forEach(item => {
          if (!map.has(item.date)) map.set(item.date, []);
          map.get(item.date).push({
            clientId: c.id, code: c.code, name: c.name, manager: c.manager || '',
            mentorId,                                       // ← добавлено для match с schedule_responses.mentor_id
            tariff: c.tariff || '', ordered: +c.ordered || 0,
            done: deriveDoneLocal(c), count: item.remaining,
            plannedCount: item.planned, completedCount: item.completed, color
          });
        });
      });
      return map;
    }

    /** Только вручную запланированные системные действия по статусам. */
    function collectStatusActionsByDate() {
      const map = new Map();
      Store.listProfileStatusActionTasks(todayISO()).forEach(task => {
        if (!task.plannedDate || !matchesManager(String(task.manager || '').trim())) return;
        const mentor = mentorById(task.mentorId);
        const profile = profileById(task.profileId);
        if (!mentor || !profile) return;
        if (!map.has(task.plannedDate)) map.set(task.plannedDate, []);
        map.get(task.plannedDate).push({
          ...task,
          code: mentor.code || '',
          name: mentor.name || '',
          accountLabel: profileLabel(profile)
        });
      });
      publicationRequests.forEach(request => {
        const task = publicationRequestTask(request);
        if (!task.date || !matchesManager(task.manager)) return;
        const mentor = mentorById(task.mentorId);
        const profile = profileById(task.profileId);
        if (!mentor || !profile) return;
        if (!map.has(task.date)) map.set(task.date, []);
        map.get(task.date).push({
          ...task,
          code: mentor.code || request.anketa_code || '',
          name: mentor.name || request.anketa_name || '',
          accountLabel: request.account_name || profileLabel(profile)
        });
      });
      return map;
    }

    /** Локальный аналог deriveDone из clients.html (для прогресс-подписи).
     *  Считается на лету по reviews+statuses, чтобы цифра была актуальной. */
    function deriveDoneLocal(c) {
      const code = String(c.code||'').toLowerCase().trim();
      if (!code) return 0;
      const mentorIds = new Set((Store.state.mentors||[])
        .filter(m => String(m.code||'').toLowerCase().trim() === code).map(m => m.id));
      if (!mentorIds.size) return 0;
      const approved = (Store.state.reviews||[])
        .filter(r => mentorIds.has(r.mentorId) && r.moderation === 'approved');
      const statuses = Store.state.profileStatuses||[];
      return approved.filter(r => statuses.some(
        s => s.mentorId === r.mentorId && s.profileId === r.profileId && s.status === '🎯 Готов'
      )).length;
    }

    function fmtDateRu(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });
    }
    function monthLabel(d) {
      const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      return `${months[d.getMonth()]} ${d.getFullYear()}`;
    }
    function taskCountLabel(count) {
      const n = Math.abs(Number(count) || 0);
      const mod100 = n % 100;
      const mod10 = n % 10;
      const word = mod100 >= 11 && mod100 <= 14
        ? 'задач'
        : (mod10 === 1 ? 'задача' : (mod10 >= 2 && mod10 <= 4 ? 'задачи' : 'задач'));
      return `${n} ${word}`;
    }

    function renderSchedSummary(byDate, actionsByDate) {
      const today = todayISO();
      const tomorrow = (() => { const d = new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
      const weekEnd  = (() => { const d = new Date(); d.setDate(d.getDate()+7); return d.toISOString().slice(0,10); })();
      const monthEnd = (() => { const d = new Date(); d.setDate(d.getDate()+30); return d.toISOString().slice(0,10); })();
      function sumIn(from, to) {
        let reviews = 0, tasks = 0, clientsSet = new Set();
        byDate.forEach((rows, date) => {
          if (date >= from && date <= to) {
            rows.forEach(r => {
              reviews += r.count;
              if (r.count > 0) clientsSet.add(r.clientId);
            });
          }
        });
        actionsByDate.forEach((rows, date) => {
          if (date >= from && date <= to) {
            tasks += rows.length;
            rows.forEach(r => clientsSet.add(r.mentorId));
          }
        });
        return { n: reviews + tasks, reviews, tasks, clients: clientsSet.size };
      }
      function statSub(value, empty = 'нет планов') {
        if (!value.n) return empty;
        const parts = [];
        if (value.reviews) parts.push(`${value.reviews} откл.`);
        if (value.tasks) parts.push(taskCountLabel(value.tasks));
        return parts.join(' · ');
      }
      const tdy = sumIn(today, today);
      const tmr = sumIn(tomorrow, tomorrow);
      const wk  = sumIn(today, weekEnd);
      const mo  = sumIn(today, monthEnd);
      document.getElementById('schedSummary').innerHTML = `
        <div class="sched-stat sched-stat--today">
          <div class="sched-stat__label">Сегодня</div>
          <div class="sched-stat__value">${tdy.n}</div>
          <div class="sched-stat__sub">${statSub(tdy)}</div>
        </div>
        <div class="sched-stat">
          <div class="sched-stat__label">Завтра</div>
          <div class="sched-stat__value">${tmr.n}</div>
          <div class="sched-stat__sub">${statSub(tmr, '—')}</div>
        </div>
        <div class="sched-stat">
          <div class="sched-stat__label">Неделя</div>
          <div class="sched-stat__value">${wk.n}</div>
          <div class="sched-stat__sub">${statSub(wk, '—')}</div>
        </div>
        <div class="sched-stat">
          <div class="sched-stat__label">30 дней</div>
          <div class="sched-stat__value">${mo.n}</div>
          <div class="sched-stat__sub">${statSub(mo, '—')}</div>
        </div>
      `;
    }

    function renderSchedGrid(byDate, actionsByDate) {
      const m = schedState.month;
      const y = m.getFullYear(), mm = m.getMonth();
      const first = new Date(y, mm, 1);
      const last  = new Date(y, mm + 1, 0);
      const firstDow = (first.getDay() + 6) % 7;
      const daysInMonth = last.getDate();
      const today = todayISO();

      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(`<div class="sched-cell sched-cell--empty"></div>`);
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${y}-${String(mm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const rows = byDate.get(iso) || [];
        const total = rows.reduce((s, r) => s + r.count, 0);
        const doneTotal = rows.reduce((s, r) => s + r.completedCount, 0);
        const taskTotal = (actionsByDate.get(iso) || []).length;
        const uniqColors = [...new Set(rows.map(r => r.color))].slice(0, 5);
        const dots = uniqColors.map(c => `<span class="sched-cell__dot" style="background:${c}"></span>`).join('');
        const cls = [
          'sched-cell',
          iso === today ? 'is-today' : '',
          iso === schedState.selected ? 'is-selected' : '',
          total > 0 ? 'has-plan' : '',
          taskTotal > 0 ? 'has-task' : ''
        ].filter(Boolean).join(' ');
        const lowerBadge = [
          doneTotal > 0 ? `✓ ${doneTotal}` : '',
          taskTotal > 0 ? taskCountLabel(taskTotal) : ''
        ].filter(Boolean).join(' · ');
        cells.push(`
          <button class="${cls}" data-iso="${iso}">
            ${total > 0 ? `<span class="sched-cell__count">${total}</span>` : ''}
            <span class="sched-cell__day">${d}</span>
            ${dots ? `<span class="sched-cell__dots">${dots}</span>` : ''}
            ${lowerBadge ? `<span class="sched-cell__task-count" data-tone="${taskTotal > 0 ? 'task' : 'done'}">${lowerBadge}</span>` : ''}
          </button>
        `);
      }
      const pad = (7 - ((firstDow + daysInMonth) % 7)) % 7;
      for (let i = 0; i < pad; i++) cells.push(`<div class="sched-cell sched-cell--empty"></div>`);
      document.getElementById('schedGrid').innerHTML = cells.join('');
      document.getElementById('schedMonth').textContent = monthLabel(m);

      document.querySelectorAll('.sched-cell[data-iso]').forEach(el => {
        el.addEventListener('click', () => {
          schedState.selected = el.dataset.iso;
          renderSched();
        });
      });
    }

    function renderSchedDayDetail(byDate, actionsByDate) {
      const rawRows = byDate.get(schedState.selected) || [];
      const actionRows = actionsByDate.get(schedState.selected) || [];
      const rows = rawRows;
      const totalCount = rows.reduce((s, r) => s + r.count, 0);
      const completedCount = rows.reduce((s, r) => s + r.completedCount, 0);
      const metaParts = [];
      if (totalCount > 0) metaParts.push(`${totalCount} откл. осталось`);
      if (completedCount > 0) metaParts.push(`✓ ${completedCount} сделано`);
      if (actionRows.length) metaParts.push(taskCountLabel(actionRows.length));
      const meta = metaParts.length ? metaParts.join(' · ') : 'нет планов';
      const reviewBody = rows.map(r => {
            const isDone = r.count === 0 && r.completedCount > 0;
            const left = Math.max(0, r.ordered - r.done);
            // Найдём ответ клиента по этой паре (mentor_id, date)
            const respKey = (r.mentorId || r.code || '') + '|' + schedState.selected;
            const resp = schedState.responses.get(respKey);
            let respBadge = '';
            if (resp) {
              // Если смотрим день-ЦЕЛЬ переноса (chosen_date != schedule_date
              // и selected совпадает с chosen_date) — визуально это «согласие
              // на эту дату», а не «отказ». Текст бейджа делаем зелёный.
              const isMovedTo = (resp.response === 'no'
                                  && resp.chosen_date
                                  && resp.chosen_date !== resp.schedule_date
                                  && resp.chosen_date === schedState.selected);
              const effectiveResp = isMovedTo ? 'yes' : resp.response;
              const lbl = respLabel(effectiveResp);
              if (lbl) {
                let when = resp.chosen_time ? ` · в ${resp.chosen_time}` : '';
                const title = `${lbl.text}${resp.responded_at ? ' · ' + new Date(resp.responded_at).toLocaleString('ru-RU') : ''}`;
                respBadge = `<span class="sched-row__resp" data-tone="${lbl.tone}" title="${title}">${lbl.icon} ${lbl.text}${when}</span>`;
              }
            }
            const clientContent = `
              <strong>${escapeHtml(r.code || '')}</strong>
              ${r.name ? ` · ${escapeHtml(r.name)}` : ''}
              <span class="sched-row__progress">${r.manager ? escapeHtml(r.manager) + ' · ' : ''}${r.tariff ? escapeHtml(r.tariff) + ' · ' : ''}${r.done}/${r.ordered} (${left} осталось)${r.completedCount ? ` · откликов сделано: ${r.completedCount}` : ''}</span>`;
            return `
              <div class="sched-row${isDone ? ' is-done' : ''}">
                <span class="sched-row__dot" style="background:${r.color}"></span>
                ${clientPhotoTriggerHtml(r.mentorId, clientContent, 'sched-row__name')}
                ${respBadge}
                <span class="sched-row__count">${isDone ? '✓' : r.count}</span>
                <a class="sched-row__link" href="clients.html?focus=${encodeURIComponent(r.clientId)}">График →</a>
              </div>
            `;
          }).join('');
      const actionBody = actionRows.map(task => {
        const isClientRequest = task.source === 'client_publication_request';
        const clientContent = `
          <strong>${escapeHtml(task.code || '')}</strong>
          ${task.name ? ` · ${escapeHtml(task.name)}` : ''}
          <span class="sched-row__progress">${escapeHtml(task.manager || 'не назначен')} · ${escapeHtml(task.accountLabel)} · ${escapeHtml(task.note)}</span>`;
        return `
          <div class="sched-row sched-row--task${isClientRequest ? ' task-card--client-request' : ''}">
            <span class="sched-row__dot" style="background:${isClientRequest ? '#22c55e' : '#a855f7'}"></span>
            ${clientPhotoTriggerHtml(task.mentorId, clientContent, 'sched-row__name')}
            <span class="sched-row__task-label">${isClientRequest ? 'КЛИЕНТ' : 'СТАТУС'}</span>
            ${isClientRequest
              ? `<button class="sched-row__link" type="button" data-calendar-accept-publication="${escapeHtml(task.requestId)}">Подтвердить</button>
                 <button class="sched-row__link" type="button" data-calendar-reject-publication="${escapeHtml(task.requestId)}">Отклонить</button>`
              : `<button class="sched-row__link" type="button" data-calendar-schedule-status="${escapeHtml(task.statusId)}">Перенести</button>`}
            <a class="sched-row__link" href="statuses.html?profileId=${encodeURIComponent(task.profileId)}&mentorId=${encodeURIComponent(task.mentorId)}">Открыть →</a>
          </div>`;
      }).join('');
      const body = reviewBody || actionBody
        ? reviewBody + actionBody
        : `<div class="sched-empty-day">На этот день ничего не запланировано.</div>`;
      document.getElementById('schedDayDetail').innerHTML = `
        <div class="sched-day-detail__title">
          ${fmtDateRu(schedState.selected)}
          <span class="sched-day-detail__meta">${meta}</span>
        </div>
        ${body}
      `;
      document.querySelectorAll('[data-calendar-schedule-status]').forEach(btn => {
        btn.addEventListener('click', () => openStatusSchedule(btn.dataset.calendarScheduleStatus));
      });
      document.querySelectorAll('[data-calendar-accept-publication]').forEach(btn => {
        btn.addEventListener('click', () => resolvePublicationRequest(btn.dataset.calendarAcceptPublication, true));
      });
      document.querySelectorAll('[data-calendar-reject-publication]').forEach(btn => {
        btn.addEventListener('click', () => resolvePublicationRequest(btn.dataset.calendarRejectPublication, false));
      });
    }

    async function renderSched() {
      const byDate = collectScheduleByDate();
      const actionsByDate = collectStatusActionsByDate();
      renderSchedSummary(byDate, actionsByDate);
      renderSchedGrid(byDate, actionsByDate);
      renderSchedDayDetail(byDate, actionsByDate);
      // ответы клиентов подтягиваем в фоне и перерендерим список дня
      loadScheduleResponses().then(() => renderSchedDayDetail(byDate, actionsByDate));
    }

    document.getElementById('schedPrev').addEventListener('click', () => {
      schedState.month = new Date(schedState.month.getFullYear(), schedState.month.getMonth() - 1, 1);
      renderSched();
    });
    document.getElementById('schedNext').addEventListener('click', () => {
      schedState.month = new Date(schedState.month.getFullYear(), schedState.month.getMonth() + 1, 1);
      renderSched();
    });
    document.getElementById('schedToday').addEventListener('click', () => {
      const t = new Date();
      schedState.month = new Date(t.getFullYear(), t.getMonth(), 1);
      schedState.selected = todayISO();
      renderSched();
    });
    window.addEventListener('cloudstate:updated', renderSched);
    window.addEventListener('store:reloaded', renderSched);
    window.addEventListener('outreachschedule:updated', renderSched);
    renderSched();

    async function refreshPublicationRequests() {
      publicationRequests = await loadPublicationRequests();
      render();
      renderSched();
    }
    async function refreshPublicationSnapshotSchema() {
      if (publicationSnapshotsRefreshed) return;
      if (!window.CloudSync || !window.CloudSync.pushClientSnapshots) return;
      publicationSnapshotsRefreshed = true;
      try { await window.CloudSync.pushClientSnapshots(Store.state); }
      catch (error) {
        publicationSnapshotsRefreshed = false;
        console.warn('[tasks] client snapshot refresh failed', error);
      }
    }
    refreshPublicationRequests();
    window.setInterval(refreshPublicationRequests, 60000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshPublicationRequests();
    });
    window.addEventListener('cloudstate:updated', refreshPublicationSnapshotSchema);
  });
  </script>
</body>
</html>
