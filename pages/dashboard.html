<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://mentori.tech https://*.supabase.co https://mentori-tg.rubicon1326.workers.dev https://*.lte-center.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Дашборд — Mentori CRM</title>
  <link rel="stylesheet" href="../css/styles.css?v=20260628a"/>
  <!-- Chart.js self-hosted (jsdelivr иногда подзаблочен в РФ). -->
  <script src="../vendor/chart.umd.min.js"></script>
  <style>
    /* Компактный дашборд + округлые формы + цветовая разбивка по блокам. */
    .page-title { margin-bottom: 18px; }
    .page-title h1 { font-size: 22px; }

    /* Круглые «pill»-карточки и панели */
    .card, .card--compact, .panel {
      border-radius: 20px !important;
    }
    .card--compact { padding: 12px 16px; }
    .card--compact .card__label {
      font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .7;
    }
    .card--compact .card__value { font-size: 18px; margin-top: 4px; font-weight: 600; }

    .cards--compact { margin-bottom: 14px; gap: 10px; grid-template-columns: repeat(5, 1fr); }
    .grid-2 { margin-bottom: 14px; gap: 14px; }
    .panel__body { padding: 14px 16px; }
    .panel__header { padding: 14px 18px 6px; border: 0; }
    .panel__header h3 { font-size: 13px; font-weight: 600; }
    .chart-wrap { height: 220px; }
    .table th, .table td { padding: 7px 12px; font-size: 12px; }
    .table th { font-size: 10px; letter-spacing: .05em; }

    /* Заголовки разделов с цветным акцентом и иконкой */
    .group-title {
      display: flex; align-items: center; gap: 10px;
      margin: 22px 0 12px;
      font-size: 11px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-2, #a0a0a0);
    }
    .group-title:first-child { margin-top: 6px; }
    .group-title__dot {
      width: 8px; height: 8px; border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.04);
    }
    .group-title__line {
      flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent);
    }
    .group-finance  .group-title__dot { background: #ff7a00; box-shadow: 0 0 0 4px rgba(255,122,0,0.15); }
    .group-mailer   .group-title__dot { background: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.15); }

    /* Лёгкий цветной хайлайт фона для карточек каждой группы */
    .group-finance .cards--compact .card--compact {
      background: linear-gradient(180deg, rgba(255,122,0,0.04), rgba(255,122,0,0) 80%), var(--bg-elev);
      border-color: rgba(255,122,0,0.18);
    }
    .group-mailer  .cards--compact .card--compact {
      background: linear-gradient(180deg, rgba(59,130,246,0.05), rgba(59,130,246,0) 80%), var(--bg-elev);
      border-color: rgba(59,130,246,0.18);
    }

    .accounts-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 18px 18px; }
    .accounts-row .badge { font-size: 12px; padding: 6px 12px; border-radius: 999px; }

    @media (max-width: 1100px) {
      .cards--compact { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div data-component="sidebar" data-active="dashboard"></div>

    <div class="main">
      <div data-component="header" data-title="Дашборд"></div>

      <main class="content">
        <div class="page-title">
          <h1>Дашборд</h1>
        </div>

        <!-- ════════════════════════ ФИНАНСЫ ═══════════════════════════════ -->
        <div class="group-finance">
          <div class="group-title">
            <span class="group-title__dot"></span>
            💰 Финансы · текущий месяц
            <span class="group-title__line"></span>
            <a href="finance-pulse.html" class="btn btn--ghost btn--sm" style="font-weight:500">Пульс кэша →</a>
          </div>

          <!-- Баннер «Свободный кэш» — подтягивается с finance-pulse.html -->
          <a href="finance-pulse.html" id="freeCashBanner"
             style="display:flex;align-items:center;gap:18px;padding:14px 22px;margin-bottom:14px;
                    background:var(--bg-elev); border:1px solid var(--border); border-radius:20px;
                    text-decoration:none; color:inherit; transition: border-color .15s">
            <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;flex-shrink:0">
              💰 Свободный<br>кэш
            </div>
            <div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums" id="freeCashValue">— ₽</div>
            <div style="flex:1;font-size:11px;opacity:.65" id="freeCashFormula">баланс − себест. остатка − фикс</div>
            <div style="font-size:11px;opacity:.5" id="freeCashMeta">→</div>
          </a>

          <section class="cards cards--compact" id="monthKpiCards"></section>

          <div class="grid-2">
            <div class="panel">
              <div class="panel__header">
                <h3>Доходы и расходы по месяцам</h3>
                <div class="spacer"></div>
                <span class="badge badge--gray" id="chartMonths">—</span>
              </div>
              <div class="panel__body">
                <div class="chart-wrap"><canvas id="revChart"></canvas></div>
              </div>
            </div>

            <div class="panel">
              <div class="panel__header">
                <h3>Ближайшие платежи</h3>
                <div class="spacer"></div>
                <a href="subscriptions.html" class="btn btn--ghost btn--sm">Все →</a>
              </div>
              <div class="table-wrap">
                <table class="table" style="min-width:auto">
                  <thead>
                    <tr>
                      <th>Подписка</th>
                      <th class="num">Сумма</th>
                      <th>Срок</th>
                    </tr>
                  </thead>
                  <tbody id="subRows"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- ════════════════════════ РАССЫЛЬЩИК ════════════════════════════ -->
        <div class="group-mailer">
          <div class="group-title">
            <span class="group-title__dot"></span>
            📡 Telegram-рассыльщик
            <span id="botStatsStatus" class="badge badge--gray" style="font-weight:400; text-transform:none; letter-spacing:normal">—</span>
            <span class="group-title__line"></span>
          </div>

          <section class="cards cards--compact" id="botKpiCards">
            <div class="card card--compact"><div class="card__label">…</div></div>
          </section>

          <div class="grid-2" style="grid-template-columns: 1fr 1fr">
            <div class="panel">
              <div class="panel__header">
                <h3>Заявки из @MentoriTG_bot</h3>
              </div>
              <div class="table-wrap">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Дата</th>
                      <th>Имя</th>
                      <th>Услуга</th>
                      <th>Статус</th>
                    </tr>
                  </thead>
                  <tbody id="botOrdersRows"></tbody>
                </table>
              </div>
            </div>

            <div class="panel">
              <div class="panel__header">
                <h3>Аккаунты рассыльщика</h3>
              </div>
              <div class="accounts-row" id="botAccountsBadges"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../data/seed.js"></script>
  <script src="../js/app.js?v=20260713a"></script>
  <script src="../js/supabase-client.js?v=20260528a"></script>
  <script src="../js/auth-gate.js"></script>
  <script src="../js/cloud-sync.js?v=20260710b"></script>
  <script src="../js/accounts-sync.js"></script>
  <script src="../js/reviews-sync.js"></script>
  <script src="../js/schedule-apply.js?v=20260522b"></script>
  <script src="../js/bot-stats.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../components/header.js"></script>
  <script src="../components/table.js"></script>

  <script>
  /* ========================================================================
     Compact-дашборд: финансы за месяц + рассыльщик + график + подписки.
     Никаких «всё время», «сотрудники», «последние доходы», «должники» —
     эти таблицы есть на своих страницах, главный экран не для них.
     ======================================================================== */
  document.addEventListener('DOMContentLoaded', () => {
    const { Store, fmtMoney, fmtDate, todayISO } = window.App;
    const state = Store.load();

    /* ---- Баннер «Свободный кэш» (синхронизирован с finance-pulse.html) ---- */
    // Алгоритм идентичный с /pages/clients.html и /pages/finance-pulse.html —
    // считаем фактическое число одобренных отзывов с правильным статусом.
    // НЕ берём client.done как fallback — оно устаревшее.
    const DONE_STATUS_DASH = '🎯 Готов';
    function deriveDone(c) {
      const code = String(c.code || '').toLowerCase().trim();
      if (!code) return 0;
      const mentorIds = new Set((Store.state.mentors || [])
        .filter(m => String(m.code || '').toLowerCase().trim() === code).map(m => m.id));
      if (!mentorIds.size) return 0;
      const reviews = (Store.state.reviews || []).filter(
        r => mentorIds.has(r.mentorId) && r.moderation === 'approved'
      );
      const statuses = Store.state.profileStatuses || [];
      return reviews.filter(r => statuses.some(
        s => s.mentorId === r.mentorId && s.profileId === r.profileId && s.status === DONE_STATUS_DASH
      )).length;
    }
    function renderFreeCashBanner() {
      const f = Store.state.finance || {};
      const phoneCost = +f.phoneCostPerReview || 100;
      const nastyaRate = +f.nastyaRate || 300;
      const proxyMonthly = (+f.proxyCount || 3) * (+f.proxyEach || 2250);
      const fix = proxyMonthly + (+f.antidetectMonthly || 1200);
      const ratePerLeft = (f.scenario === 'nastya' ? nastyaRate : 0) + phoneCost;
      // Фильтр activeClients — ИДЕНТИЧНЫЙ с /finance-pulse: пропускаем
      // closed-флаг и доделанных+полностью оплаченных. Без этого дашборд
      // считал на старом наборе клиентов и расходился с пульсом.
      const clients = (Store.state.clients || []).filter(c => {
        if (c.closed === true) return false;
        const ordered = +c.ordered || 0;
        const done    = deriveDone(c);
        const remain  = +c.remain || 0;
        if (ordered <= 0) return false;
        if (done >= ordered && remain <= 0) return false;
        return true;
      });
      const obligations = clients.reduce((s, c) => s + Math.max(0, (+c.ordered||0) - deriveDone(c)) * ratePerLeft, 0);
      const free = (+f.balance || 0) - obligations - fix;
      const valueEl   = document.getElementById('freeCashValue');
      const formulaEl = document.getElementById('freeCashFormula');
      const metaEl    = document.getElementById('freeCashMeta');
      const banner    = document.getElementById('freeCashBanner');
      valueEl.textContent = fmtMoney(free);
      valueEl.style.color = free < 0 ? '#ef4444' : (free < fix ? '#ff9a3c' : '#22c55e');
      formulaEl.innerHTML = `Баланс <strong>${fmtMoney(f.balance || 0)}</strong> − Себест.остатка <strong>${fmtMoney(obligations)}</strong> − Фикс/мес <strong>${fmtMoney(fix)}</strong>`;
      metaEl.innerHTML = f.balanceUpdatedAt
        ? `обновлено: ${new Date(f.balanceUpdatedAt).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })} →`
        : `<span style="color:#ff9a3c">⚠ Введи баланс →</span>`;
      banner.style.borderColor = free < 0 ? 'rgba(239,68,68,0.4)' :
                                 (free < fix ? 'rgba(255,154,60,0.4)' : 'rgba(34,197,94,0.4)');
    }
    renderFreeCashBanner();
    window.addEventListener('finance:updated',     renderFreeCashBanner);
    window.addEventListener('cloudstate:updated',  renderFreeCashBanner);
    window.addEventListener('reviews:updated',     renderFreeCashBanner);

    /* ---- Финансы за месяц + клиенты в работе ---- */
    function renderMonthKpis() {
      const st = Store.state;
      const t  = Store.totals();
      const currMonthKey = todayISO().slice(0, 7);
      const monthIncome  = st.income.filter(r => (r.date||'').startsWith(currMonthKey))
                                    .reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const monthExpense = st.expenses.filter(r => (r.date||'').startsWith(currMonthKey))
                                      .reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const monthProfit  = monthIncome - monthExpense;
      const salaryDebt   = st.employees
          .filter(e => e.status === 'active')
          .reduce((s, e) => s + Math.max(0, (+e.reviewsDone||0) * (+e.ratePerReview||0) - (+e.paid||0)), 0);
      const monthKpis = [
        { label: 'Доход за месяц',     value: fmtMoney(monthIncome),  tone: 'up'   },
        { label: 'Расход за месяц',    value: fmtMoney(monthExpense), tone: 'down' },
        { label: 'Прибыль за месяц',   value: fmtMoney(monthProfit),  tone: monthProfit >= 0 ? 'up' : 'down' },
        { label: 'Клиентов в работе',  value: t.clientsActive + (t.clientsOverdue ? ` · ⚠ ${t.clientsOverdue}` : ''), tone: t.clientsOverdue ? 'down' : '' },
        { label: 'ЗП долг',            value: fmtMoney(salaryDebt),   tone: salaryDebt > 0 ? 'down' : '' }
      ];
      document.getElementById('monthKpiCards').innerHTML = monthKpis.map(k => `
        <div class="card card--compact">
          <div class="card__label">${k.label}</div>
          <div class="card__value ${k.tone}">${k.value}</div>
        </div>
      `).join('');
    }
    renderMonthKpis();
    window.addEventListener('reviews:updated',   renderMonthKpis);
    window.addEventListener('cloudstate:updated', renderMonthKpis);

    /* ---- График доход/расход по месяцам ---- */
    try {
    if (typeof Chart === 'undefined') {
      document.getElementById('revChart').parentElement.innerHTML =
        '<div class="empty">Chart.js не загрузился. Проверь что /vendor/chart.umd.min.js доступен.</div>';
      throw new Error('Chart undefined');
    }
    const monthly = Store.monthlyStats();
    document.getElementById('chartMonths').textContent = monthly.length + ' мес.';
    const revCtx = document.getElementById('revChart').getContext('2d');
    Chart.defaults.color = '#a0a0a0';
    Chart.defaults.font.family = "-apple-system, Inter, sans-serif";
    const gradient = (ctx, from, to) => {
      const g = ctx.createLinearGradient(0, 0, 0, 220);
      g.addColorStop(0, from); g.addColorStop(1, to); return g;
    };
    new Chart(revCtx, {
      type: 'bar',
      data: {
        labels: monthly.map(m => m.label),
        datasets: [
          { label: 'Доход',  data: monthly.map(m => m.income),  backgroundColor: gradient(revCtx, 'rgba(255,122,0,0.9)', 'rgba(255,122,0,0.3)'), borderRadius: 6, maxBarThickness: 24 },
          { label: 'Расход', data: monthly.map(m => m.expense), backgroundColor: 'rgba(239,68,68,0.75)', borderRadius: 6, maxBarThickness: 24 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { usePointStyle: true, padding: 12, font: { size: 11 } } },
          tooltip: {
            backgroundColor: '#181818', borderColor: '#2a2a2a', borderWidth: 1, padding: 10, cornerRadius: 8,
            callbacks: { label: c => c.dataset.label + ': ' + fmtMoney(c.parsed.y) }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#a0a0a0', font: { size: 10 } } },
          y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#a0a0a0', font: { size: 10 }, callback: v => (v/1000) + 'k' } }
        }
      }
    });
    } catch (e) { console.warn('Chart render failed:', e); }

    /* ---- Ближайшие платежи (5 строк) ---- */
    try {
    const today = new Date(todayISO());
    const subs = [...(state.subscriptions || [])]
      .filter(s => s.nextDate)
      .map(s => ({ ...s, days: Math.round((new Date(s.nextDate) - today) / 86400000) }))
      .sort((a, b) => a.days - b.days)
      .slice(0, 5);
    const subRowsEl = document.getElementById('subRows');
    subRowsEl.innerHTML = subs.length === 0
      ? `<tr><td colspan="3" class="empty">Нет подписок.</td></tr>`
      : subs.map(s => {
          let badge;
          if (s.days < 0)       badge = `<span class="badge badge--red">просрочено ${-s.days} дн.</span>`;
          else if (s.days === 0) badge = `<span class="badge badge--orange">сегодня</span>`;
          else if (s.days <= 7) badge = `<span class="badge badge--orange">через ${s.days} дн.</span>`;
          else                   badge = `<span class="badge badge--gray">через ${s.days} дн.</span>`;
          return `<tr><td>${escapeHtml(s.name)}</td><td class="num">${fmtMoney(s.amount)}</td><td>${badge}</td></tr>`;
        }).join('');
    } catch (e) { console.warn('Subs render failed:', e); }
  });

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  </script>
</body>
</html>
