<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://mentori.tech https://*.supabase.co https://mentori-tg.rubicon1326.workers.dev https://*.lte-center.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b0b0c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mentori"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=20260820"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=20260820"/>
  <link rel="manifest" href="./manifest.webmanifest?v=20260820"/>
  <title>Анкета — Mentori</title>
  <link rel="stylesheet" href="../../css/styles.css?v=20260628a"/>
  <link rel="stylesheet" href="client.css?v=20260829c"/>
</head>
<body class="cli-body">
  <div data-cli-header></div>

  <main class="cli-main">
    <div data-cli-profile>
      <div class="cli-empty">Загрузка…</div>
    </div>
  </main>

  <script src="../../js/supabase-client.js?v=20260820d"></script>
  <script src="./package-progress.js?v=20260820c"></script>
  <script src="./order-cart.js?v=20260820b"></script>
  <script src="./client-app.js?v=20260830a"></script>
  <script>
  (async () => {
    const ok = await window.ClientApp.requireLogin();
    if (!ok) return;
    const snap = await window.ClientApp.loadSnapshot();
    window.ClientApp.renderHeader(snap);
    const params = new URLSearchParams(location.search);
    const mentorId = params.get('id');
    if (!snap || !snap.payload) {
      document.querySelector('[data-cli-profile]').innerHTML =
        '<a href="./index.html" class="cli-back">← Назад</a><div class="cli-empty">Данные ещё не загружены. Свяжитесь с менеджером.</div>';
      return;
    }
    if (!mentorId) {
      location.replace('./index.html'); return;
    }
    const [myOrders, publicationRequests, outreachSlots, textApprovals] = await Promise.all([
      window.ClientApp.loadMyOrders(),
      window.ClientApp.loadMyPublicationRequests(),
      window.ClientApp.loadMyOutreachSlots(),
      window.ClientApp.loadMyTextApprovals()
    ]);
    window.ClientApp.renderProfileDetail(
      snap.payload, mentorId, myOrders, publicationRequests, outreachSlots, textApprovals
    );
  })();
  </script>
</body>
</html>
