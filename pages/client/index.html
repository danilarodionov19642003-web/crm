<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://mentori.tech https://*.supabase.co https://mentori-tg.rubicon1326.workers.dev https://*.lte-center.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Личный кабинет — Mentori</title>
  <link rel="stylesheet" href="../../css/styles.css?v=20260628a"/>
  <link rel="stylesheet" href="client.css?v=20260628f"/>
</head>
<body class="cli-body">
  <div data-cli-header></div>

  <main class="cli-main">
    <!-- Заказать отзывы: реквизиты + выбор тарифа/анкеты. Скрыт, пока владелец
         не задал тарифы в CRM (client-app.renderOrder снимает hidden). -->
    <div class="cli-order-cta" data-cli-order-cta hidden>
      <div class="cli-order-cta__text">
        <div class="cli-order-cta__title">Нужны ещё отзывы?</div>
        <div class="cli-order-cta__sub">Выбери тариф и анкету — покажем актуальные реквизиты для оплаты.</div>
      </div>
      <button class="cli-order-cta__btn" id="cliOrderBtn" type="button">💳 Заказать отзывы</button>
    </div>

    <!-- Мои заказы: заявки клиента со статусом (на проверке / подтверждён). -->
    <div class="cli-orders" data-cli-orders hidden></div>

    <!-- Бесплатные MTProxy для Telegram — наверху, чтобы клиент сразу мог
         включить рабочий прокси если у него Telegram не открывается.
         Обновляются раз в 30 мин на сервере, тестируются с РФ-IP. -->
    <h2 class="cli-section-title">Прокси для Telegram</h2>
    <div class="cli-proxy-block" data-cli-proxies>
      <div class="cli-empty">Загрузка прокси…</div>
    </div>

    <h2 class="cli-section-title">Сводка</h2>
    <div class="cli-kpis" data-cli-totals></div>

    <h2 class="cli-section-title">Анкеты</h2>
    <div class="cli-list" data-cli-anketas>
      <div class="cli-empty">Загрузка…</div>
    </div>

    <h2 class="cli-section-title">Календарь</h2>
    <div class="cli-cal" data-cli-calendar></div>

    <div data-cli-feed style="margin-top:22px"></div>

    <footer class="cli-foot">
      <button type="button" class="cli-foot__link" data-cli-terms>Условия заказа</button>
    </footer>
  </main>

  <!-- Условия заказа (оферта): открывается по ссылке из галочки и из футера. -->
  <div class="cli-modal" id="cliTermsModal" hidden style="z-index:120">
    <div class="cli-modal__backdrop" data-cli-terms-close></div>
    <div class="cli-modal__box">
      <div class="cli-modal__head">
        <h3>Условия заказа</h3>
        <button class="cli-modal__x" type="button" data-cli-terms-close>✕</button>
      </div>
      <div class="cli-modal__body cli-terms" data-cli-terms-body></div>
    </div>
  </div>

  <!-- Модалка заказа отзывов. Тело рендерит client-app.openOrderModal. -->
  <div class="cli-modal" id="cliOrderModal" hidden>
    <div class="cli-modal__backdrop" data-cli-order-close></div>
    <div class="cli-modal__box">
      <div class="cli-modal__head">
        <h3>Заказать отзывы</h3>
        <button class="cli-modal__x" type="button" data-cli-order-close>✕</button>
      </div>
      <div class="cli-modal__body" data-cli-order-body></div>
    </div>
  </div>

  <script src="../../js/supabase-client.js?v=20260528a"></script>
  <script src="./client-app.js?v=20260628f"></script>
  <script>
  (async () => {
    const ok = await window.ClientApp.requireLogin();
    if (!ok) return;
    const snap = await window.ClientApp.loadSnapshot();
    window.ClientApp.renderHeader(snap);
    if (!snap || !snap.payload) {
      document.querySelector('[data-cli-anketas]').innerHTML =
        '<div class="cli-empty">Данные ещё не загружены. Зайдите чуть позже или свяжитесь с менеджером.</div>';
      document.querySelector('[data-cli-totals]').innerHTML = '';
      document.querySelector('[data-cli-feed]').innerHTML = '';
    } else {
      window.ClientApp.renderTotals(snap.payload.totals, snap.payload.anketas);
      window.ClientApp.renderAnketas(snap.payload.anketas);
      window.ClientApp.renderCalendar(snap.payload);
      window.ClientApp.renderFeed(snap.payload.feed);
    }
    // Заказ отзывов (реквизиты/тарифы из снимка). Если тарифов нет — CTA скрыт.
    window.ClientApp.renderOrder(snap && snap.payload);
    // Мои заказы — заявки клиента со статусом (на проверке / подтверждён).
    window.ClientApp.renderMyOrders(await window.ClientApp.loadMyOrders());
    // Прокси — независимо от snapshot, доступны всем залогиненным клиентам.
    window.ClientApp.renderProxies();
    // Условия заказа — открытие модалки по ссылке (футер + ссылка в галочке) и закрытие
    document.querySelectorAll('[data-cli-terms]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); window.ClientApp.openTerms(); }));
    document.querySelectorAll('[data-cli-terms-close]').forEach(el => el.addEventListener('click', () => window.ClientApp.closeTerms()));
  })();
  </script>
</body>
</html>
