<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://mentori.tech https://*.supabase.co https://mentori-tg.rubicon1326.workers.dev https://*.lte-center.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b0b0c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mentori"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=20260820"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=20260820"/>
  <link rel="manifest" href="./manifest.webmanifest?v=20260820"/>
  <title>Вход — Личный кабинет</title>
  <link rel="stylesheet" href="../../css/styles.css?v=20260628a"/>
  <link rel="stylesheet" href="client.css?v=20260820k"/>
</head>
<body class="cli-body">
  <main class="cli-login">
    <div class="cli-login__card">
      <div class="cli-login__brand">
        <div class="cli-header__logo">M</div>
        <div>
          <h1>Mentori</h1>
          <p>Личный кабинет клиента</p>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" class="input" autocomplete="username" placeholder="client@example.com"/>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" class="input" autocomplete="current-password" placeholder="••••••••"/>
      </div>

      <button id="btnLogin" class="btn btn--primary" style="width:100%">Войти</button>
      <p class="cli-login__legal">
        Нажимая «Войти», вы подтверждаете ознакомление с
        <a href="../../legal/privacy.html" target="_blank" rel="noopener">Политикой конфиденциальности</a>
        и <a href="../../legal/offer.html" target="_blank" rel="noopener">Публичной офертой</a>.
      </p>
      <div id="err" class="cli-login__err" hidden></div>

      <div style="margin-top:14px;font-size:12px;color:var(--text-mute);text-align:center">
        Не помните пароль? Свяжитесь с менеджером.
      </div>
    </div>
  </main>

  <script src="../../js/supabase-client.js?v=20260820d"></script>
  <script>
  (async () => {
    const { Auth } = window.Supabase;

    function landing() {
      return './index.html';
    }

    const restored = Auth.ensureFresh ? await Auth.ensureFresh() : await Auth.refresh();
    if (restored) {
      if (Auth.role() === 'client') { location.replace(landing()); return; }
    }

    const err = document.getElementById('err');
    function showErr(msg) { err.textContent = msg; err.hidden = false; }

    async function submit() {
      err.hidden = true;
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pwd   = document.getElementById('password').value;
      if (!email || !pwd) return showErr('Введите email и пароль');

      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = 'Входим…';
      try {
        await Auth.signIn(email, pwd);
        if (Auth.role() !== 'client') {
          // Это не клиентская учётка — выкинем сессию, иначе админка решит, что юзер свой.
          try { Auth.signOut(); } catch (_) {}
          showErr('Этот аккаунт не помечен как клиент. Используйте корпоративный вход.');
          btn.disabled = false; btn.textContent = 'Войти';
          return;
        }
        location.replace(landing());
      } catch (e) {
        showErr(e.message || 'Не удалось войти');
        btn.disabled = false; btn.textContent = 'Войти';
      }
    }

    document.getElementById('btnLogin').addEventListener('click', submit);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    document.getElementById('email').addEventListener('keydown',    e => { if (e.key === 'Enter') submit(); });
  })();
  </script>
</body>
</html>
