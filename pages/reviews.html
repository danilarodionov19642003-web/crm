<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://mentori.tech https://*.supabase.co https://mentori-tg.rubicon1326.workers.dev https://*.lte-center.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b0b0c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mentori CRM"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=20260820"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=20260820"/>
  <link rel="manifest" href="/manifest.webmanifest?v=20260820"/>
  <title>Отзывы — Mentori CRM</title>
  <link rel="stylesheet" href="../css/styles.css?v=20260820b"/>
  <style>
    .rv-card { background: var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
    .rv-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .rv-head .badge { font-size:11px; }
    .rv-text { white-space:pre-wrap; font-size:14px; line-height:1.5; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,0.02); border:1px solid var(--border); }
    .rv-meta { font-size:12px; color:var(--text-mute); margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; }
    .rv-actions { display:flex; gap:8px; margin-top:10px; }
    .rv-empty { text-align:center; padding:40px; color:var(--text-mute); }
    .rv-client-approval { margin-top:10px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,.018); }
    .rv-client-approval__head { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .rv-client-approval__title { color:var(--text-mute); font-size:11px; font-weight:700; text-transform:uppercase; }
    .rv-client-approval__status { padding:4px 7px; border-radius:999px; font-size:10px; font-weight:750; }
    .rv-client-approval__status.is-pending,.rv-client-approval__status.is-portal-only { color:var(--accent); background:rgba(255,122,0,.12); }
    .rv-client-approval__status.is-approved { color:var(--green); background:rgba(34,197,94,.12); }
    .rv-client-approval__status.is-changes,.rv-client-approval__status.is-missing { color:var(--red); background:rgba(239,68,68,.12); }
    .rv-client-approval__status.is-cancelled { color:var(--text-mute); background:rgba(127,127,127,.12); }
    .rv-client-approval__meta { margin-top:6px; color:var(--text-mute); font-size:11px; }
    .rv-client-approval__comment { margin-top:7px; padding:8px 10px; border-left:3px solid var(--accent); background:rgba(255,122,0,.06); white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
    @media (max-width:640px) {
      .rv-actions { flex-wrap:wrap; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div data-component="sidebar" data-active="reviews"></div>

    <div class="main">
      <div data-component="header" data-title="Отзывы"></div>

      <main class="content">
        <div class="page-title">
          <div>
            <h1 id="pgTitle">Модерация отзывов</h1>
            <p id="pgSubtitle">Сотрудники сдают отзывы — здесь они одобряются и засчитываются в зарплату.</p>
          </div>
        </div>

        <section class="cards" id="rKpis"></section>

        <div class="filters">
          <select id="fStatus" class="select">
            <option value="pending">На модерации</option>
            <option value="approved">Одобренные</option>
            <option value="rejected">Отклонённые</option>
            <option value="">Все</option>
          </select>
          <select id="fAuthor" class="select">
            <option value="">Все сотрудники</option>
          </select>
          <select id="fPeriod" class="select">
            <option value="">Всё время</option>
            <option value="today">Сегодня</option>
            <option value="week" selected>Эта неделя</option>
            <option value="month">Этот месяц</option>
          </select>
          <input type="text" id="fSearch" class="input" placeholder="Поиск по тексту, аккаунту, клиенту..." style="flex:1;min-width:200px"/>
        </div>

        <div id="rList"><div class="rv-empty">Загружаем…</div></div>
      </main>
    </div>
  </div>

  <script src="../data/seed.js"></script>
  <script src="../js/app.js?v=20260826b"></script>
  <script src="../js/supabase-client.js?v=20260820d"></script>
  <script src="../js/auth-gate.js?v=20260726a"></script>
  <script src="../js/cloud-sync.js?v=20260820d"></script>
  <script src="../js/reviews-sync.js?v=20260717a"></script>
  <script src="../js/client-text-approvals.js?v=20260826b"></script>
  <script src="../components/sidebar.js?v=20260820b"></script>
  <script src="../components/header.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const { Store, fmtDate, toast } = window.App;
    Store.load();

    const role = (document.documentElement.dataset.role || 'owner').toLowerCase();
    const myEmail = (document.documentElement.dataset.userEmail || '').toLowerCase();
    const isOwner = role === 'owner';
    const RATE_DEFAULT = 300;

    if (!isOwner) {
      document.getElementById('pgTitle').textContent = 'Мои отзывы';
      document.getElementById('pgSubtitle').textContent = 'Здесь видны отзывы, которые ты сдала на модерацию. Одобренные засчитываются в зарплату.';
    }
    const filters = { status: 'pending', author: '', period: 'week', q: '' };
    let approvalByReview = new Map();
    let approvalLoadFailed = false;

    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function getProfile(id) {
      return (Store.state.profiles || []).find(p => p.id === id)
          || (Store.state.archivedProfiles || []).find(p => p.id === id);
    }
    function getMentor(id) {
      return (Store.state.mentors || []).find(m => m.id === id);
    }
    function periodStart(p) {
      const now = new Date();
      if (p === 'today')  { now.setHours(0,0,0,0); return now; }
      if (p === 'week')   { const d = new Date(now); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d; }
      if (p === 'month')  { return new Date(now.getFullYear(), now.getMonth(), 1); }
      return null;
    }

    function refreshFilterOptions() {
      const sel = document.getElementById('fAuthor');
      if (!isOwner) { sel.style.display = 'none'; return; }
      const emails = Array.from(new Set((Store.state.reviews || []).map(r => (r.authorEmail || '').toLowerCase()).filter(Boolean))).sort();
      const cur = sel.value;
      sel.innerHTML = '<option value="">Все сотрудники</option>' +
        emails.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join('');
      sel.value = cur;
    }

    function getRows() {
      const start = periodStart(filters.period);
      let arr = (Store.state.reviews || []).slice();
      if (!isOwner) {
        // Сотрудник видит только свои отзывы
        arr = arr.filter(r => (r.authorEmail || '').toLowerCase() === myEmail);
      } else if (filters.author) {
        arr = arr.filter(r => (r.authorEmail || '').toLowerCase() === filters.author);
      }
      if (filters.status) arr = arr.filter(r => r.moderation === filters.status);
      if (start) arr = arr.filter(r => new Date(r.submittedAt) >= start);
      if (filters.q) {
        const q = filters.q;
        arr = arr.filter(r => {
          const p = getProfile(r.profileId);
          const m = getMentor(r.mentorId);
          const s = ((r.text || '') + ' ' + (p?.code || '') + ' ' + (m?.code || '') + ' ' + (m?.name || '') + ' ' + (r.authorEmail || '')).toLowerCase();
          return s.includes(q);
        });
      }
      arr.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
      return arr;
    }

    /** Вернуть email сотрудника, которому начисляется зарплата за этот отзыв.
     *  Атрибуция = АВТОР отзыва (review.authorEmail), при условии, что у пары
     *  (mentor, profile) сейчас стоит статус «🎯 Готов». Сменили статус —
     *  отзыв перестаёт капать в зарплату. См. js/reviews-sync.js. */
    const DONE_STATUS_X = '🎯 Готов';
    function getReviewCreditEmail(r) {
      const st = (Store.state.profileStatuses || []).find(s =>
        s.mentorId === r.mentorId && s.profileId === r.profileId);
      if (!st || st.status !== DONE_STATUS_X) return null;
      const e = String(r.authorEmail || '').toLowerCase().trim();
      return e || null;
    }

    function renderKPIs() {
      const all = (Store.state.reviews || []);
      const start = periodStart(filters.period);
      const inPeriod = (r) => !start || new Date(r.submittedAt) >= start;
      let scope = all;
      if (!isOwner) scope = scope.filter(r => (r.authorEmail || '').toLowerCase() === myEmail);
      else if (filters.author) scope = scope.filter(r => (r.authorEmail || '').toLowerCase() === filters.author);
      const inP = scope.filter(inPeriod);

      const pending = inP.filter(r => r.moderation === 'pending').length;
      const approved = inP.filter(r => r.moderation === 'approved');
      const rejected = inP.filter(r => r.moderation === 'rejected').length;
      // «Заработано / К выплате» считается по АВТОРУ отзыва (authorEmail).
      // Если автор не сотрудник (например, владелец) — отзыв в зп не идёт.
      const employees = (Store.state.employees || []);
      const empEmails = new Set(employees.map(e => (e.email || '').toLowerCase().trim()).filter(Boolean));
      const creditMatches = (r) => {
        const credit = getReviewCreditEmail(r);
        if (!credit) return false;
        if (!empEmails.has(credit)) return false;  // не сотрудник = не платим
        if (isOwner) return true;
        return credit === myEmail;
      };
      const earned = approved.filter(creditMatches)
        .reduce((s,r) => s + (Number(r.rate) || RATE_DEFAULT), 0);
      const potential = inP.filter(r => r.moderation === 'pending')
        .filter(r => {
          // прогноз: автор pending-отзыва получит свою ставку, если он сотрудник
          const e = String(r.authorEmail || '').toLowerCase().trim();
          if (!e || !empEmails.has(e)) return false;
          return isOwner ? true : e === myEmail;
        })
        .reduce((s,r) => s + (Number(r.rate) || RATE_DEFAULT), 0);

      const periodLabel = filters.period === 'today' ? 'сегодня' : filters.period === 'week' ? 'неделя' : filters.period === 'month' ? 'месяц' : 'всё время';

      const kpis = isOwner ? [
        { label: `На модерации (${periodLabel})`, val: pending, color: 'var(--orange)' },
        { label: `Одобрено (${periodLabel})`,     val: approved.length, color: 'var(--green)' },
        { label: `Отклонено (${periodLabel})`,    val: rejected, color: 'var(--text-mute)' },
        { label: `К выплате (${periodLabel})`,    val: earned.toLocaleString('ru-RU') + ' ₽', color: 'var(--accent)' },
      ] : [
        { label: `На модерации (${periodLabel})`, val: pending, color: 'var(--orange)' },
        { label: `Одобрено (${periodLabel})`,     val: approved.length, color: 'var(--green)' },
        { label: `Заработано (${periodLabel})`,   val: earned.toLocaleString('ru-RU') + ' ₽', color: 'var(--accent)' },
        { label: `В ожидании одобрения`,          val: potential.toLocaleString('ru-RU') + ' ₽', color: 'var(--text-mute)' },
      ];
      document.getElementById('rKpis').innerHTML = kpis.map(k => `
        <article class="card"><div class="card__label">${k.label}</div><div class="card__value" style="color:${k.color}">${k.val}</div></article>
      `).join('');
    }

    function moderationBadge(m) {
      if (m === 'approved') return `<span class="badge badge--green"><span class="dot"></span>Одобрен</span>`;
      if (m === 'rejected') return `<span class="badge badge--red"><span class="dot"></span>Отклонён</span>`;
      return `<span class="badge badge--orange"><span class="dot"></span>На модерации</span>`;
    }

    function clientApprovalHtml(review) {
      const row = approvalByReview.get(String(review.id));
      if (!review.clientApprovalRequired && !row) return '';
      if (approvalLoadFailed && !row) {
        return `<div class="rv-client-approval">
          <div class="rv-client-approval__head">
            <span class="rv-client-approval__title">Согласование клиента</span>
            <span class="rv-client-approval__status is-missing">Статус временно недоступен</span>
          </div>
        </div>`;
      }
      const meta = window.ClientTextApprovals
        ? window.ClientTextApprovals.statusMeta(row)
        : { label: 'Не отправлен клиенту', cls: 'is-missing', key: 'missing' };
      const detail = row && row.resolved_at
        ? `Ответ: ${escapeHtml(fmtDate(row.resolved_at))}${row.resolved_by_label ? ` · ${escapeHtml(row.resolved_by_label)}` : ''}`
        : row && row.created_at
          ? `Отправлен: ${escapeHtml(fmtDate(row.created_at))}`
          : review.clientApprovalLastError
            ? 'Отправка не завершена. Текст сохранён в CRM.'
            : '';
      const comment = row && row.resolution_comment
        ? `<div class="rv-client-approval__comment"><strong>Комментарий клиента:</strong><br>${escapeHtml(row.resolution_comment)}</div>`
        : '';
      return `<div class="rv-client-approval">
        <div class="rv-client-approval__head">
          <span class="rv-client-approval__title">Согласование клиента</span>
          <span class="rv-client-approval__status ${meta.cls}">${escapeHtml(meta.label)}</span>
        </div>
        ${detail ? `<div class="rv-client-approval__meta">${detail}</div>` : ''}
        ${comment}
      </div>`;
    }

    async function refreshClientApprovals(options = {}) {
      if (!window.ClientTextApprovals) return;
      try {
        const rows = await window.ClientTextApprovals.loadRequests();
        approvalByReview = window.ClientTextApprovals.latestByReview(rows);
        approvalLoadFailed = false;
      } catch (error) {
        approvalLoadFailed = true;
        if (!options.silent) console.warn('[reviews] client approvals load failed', error);
      }
      render();
    }

    function render() {
      renderKPIs();
      refreshFilterOptions();
      const rows = getRows();
      const list = document.getElementById('rList');
      if (!rows.length) {
        list.innerHTML = `<div class="rv-empty">Под фильтр ничего не попало.</div>`;
        return;
      }
      list.innerHTML = rows.map(r => {
        const p = getProfile(r.profileId);
        const m = getMentor(r.mentorId);
        const accLabel = p
          ? `<span class="badge badge--gray">${escapeHtml(p.code || '—')}</span>${p.archived ? ' <span class="badge badge--red">🗑 удалён</span>' : ''}`
          : `<span style="color:var(--text-mute)">— анкета удалена —</span>`;
        const menLabel = m
          ? `<span class="badge badge--gray">${escapeHtml(m.code || '—')}</span> ${escapeHtml(m.name || '')}`
          : `<span style="color:var(--text-mute)">— клиент удалён —</span>`;
        // Кому засчитывается зп (если этот отзыв одобрят и есть статус «Готов»).
        // С 27.04 — атрибуция по АВТОРУ отзыва: кто опубликовал, тот и
        // получает. Если автор — владелец (нет в employees), зп никому.
        let creditLabel = '';
        if (isOwner) {
          const credit = getReviewCreditEmail(r);
          if (credit) {
            const emp = (Store.state.employees || []).find(e => (e.email || '').toLowerCase().trim() === credit);
            if (emp) {
              creditLabel = `<span title="Автор отзыва — сотрудник, ему идёт зп">💰 ${escapeHtml(emp.name || credit)}</span>`;
            } else {
              creditLabel = `<span title="Автор отзыва — не сотрудник (владелец?), зп никому" style="color:var(--text-mute)">💼 ${escapeHtml(credit)}</span>`;
            }
          }
        }
        const actions = (isOwner && r.moderation === 'pending') ? `
          <div class="rv-actions">
            <button class="btn btn--primary btn--sm" data-act="approve" data-id="${r.id}">✅ Одобрить (${(Number(r.rate)||RATE_DEFAULT)} ₽)</button>
            <button class="btn btn--ghost btn--sm" data-act="reject" data-id="${r.id}" style="color:var(--red)">✖ Отклонить</button>
          </div>` : '';
        const ownerExtra = (isOwner && r.moderation !== 'pending') ? `
          <div class="rv-actions">
            <button class="btn btn--ghost btn--sm" data-act="reopen" data-id="${r.id}">↺ Вернуть на модерацию</button>
            <button class="btn btn--ghost btn--sm" data-act="del"    data-id="${r.id}" style="color:var(--red)">🗑 Удалить</button>
          </div>` : '';
        const approval = approvalByReview.get(String(r.id));
        const approvalMeta = window.ClientTextApprovals
          ? window.ClientTextApprovals.statusMeta(approval)
          : { key: 'missing' };
        const clientActions = isOwner && r.clientApprovalRequired && (
          approvalMeta.key === 'missing' || approvalMeta.key === 'portal_only' || approvalMeta.key === 'cancelled'
        ) ? `
          <div class="rv-actions">
            <button class="btn btn--ghost btn--sm" data-act="send-client" data-id="${r.id}">${approvalMeta.key === 'portal_only' ? 'Отправить в Telegram' : 'Повторить отправку клиенту'}</button>
          </div>` : isOwner && approvalMeta.key === 'changes_requested' ? `
          <div class="rv-actions">
            <button class="btn btn--ghost btn--sm" data-act="revise-client" data-id="${r.id}">Исправить и отправить снова</button>
          </div>` : '';
        return `
          <article class="rv-card">
            <div class="rv-head">
              ${accLabel}
              <span style="opacity:.6">×</span>
              ${menLabel}
              <div style="flex:1"></div>
              ${moderationBadge(r.moderation)}
            </div>
            <div class="rv-text">${escapeHtml(r.text || '')}</div>
            ${clientApprovalHtml(r)}
            <div class="rv-meta">
              <span>👤 ${escapeHtml(r.authorEmail || '—')}</span>
              <span>📅 Сдан: ${escapeHtml(fmtDate(r.submittedAt))}</span>
              ${r.moderatedAt ? `<span>✅ Проверен: ${escapeHtml(fmtDate(r.moderatedAt))}${r.moderatedBy ? ' · ' + escapeHtml(r.moderatedBy) : ''}</span>` : ''}
              <span>💵 Ставка: ${Number(r.rate) || RATE_DEFAULT} ₽</span>
              ${creditLabel}
            </div>
            ${actions}${ownerExtra}${clientActions}
          </article>`;
      }).join('');

      list.querySelectorAll('button[data-act]').forEach(btn => {
        btn.addEventListener('click', () => act(btn.dataset.act, btn.dataset.id));
      });
    }

    async function act(action, id) {
      const r = (Store.state.reviews || []).find(x => x.id === id);
      if (!r) return;
      if (action === 'approve') {
        Store.approveReview(id, myEmail);
        toast('Отзыв одобрен — зарплата засчитана');
      } else if (action === 'reject') {
        const reason = window.prompt('Причина отклонения (необязательно):', '');
        if (reason === null) return;
        Store.rejectReview(id, myEmail, reason || '');
        toast('Отзыв отклонён');
      } else if (action === 'reopen') {
        if (!confirm('Вернуть отзыв на модерацию? Зарплата по нему отзовётся.')) return;
        r.moderation = 'pending';
        r.moderatedAt = null; r.moderatedBy = null;
        Store.save();
        toast('Возвращён на модерацию');
      } else if (action === 'del') {
        if (!confirm('Удалить отзыв навсегда? Это действие нельзя отменить.')) return;
        if (r.clientApprovalRequired && !window.ClientTextApprovals) {
          toast('Модуль согласования не загрузился. Обновите страницу и повторите.', 'error');
          return;
        }
        if (r.clientApprovalRequired) {
          const cancellation = await window.ClientTextApprovals.cancelReview(r.id);
          if (!cancellation.ok) { toast(cancellation.message, 'error'); return; }
        }
        Store.deleteReview(id);
        toast('Удалён');
      } else if (action === 'send-client') {
        if (!window.ClientTextApprovals) { toast('Модуль согласования не загрузился', 'error'); return; }
        const delivery = await window.ClientTextApprovals.sendReview(Store, r);
        if (!delivery.ok) toast(delivery.message, 'error');
        else if (delivery.telegramDelivered) toast('Текст отправлен клиенту в Telegram');
        else toast('Текст доступен в кабинете. Ответственный Telegram пока не подключён');
        await refreshClientApprovals({ silent: true });
        return;
      } else if (action === 'revise-client') {
        const nextText = window.prompt('Исправьте текст и отправьте клиенту повторно:', r.text || '');
        if (nextText === null) return;
        const cleanText = nextText.trim();
        if (!cleanText) { toast('Текст не может быть пустым', 'error'); return; }
        if (cleanText === String(r.text || '').trim()) { toast('Измените текст перед повторной отправкой', 'error'); return; }
        r.text = cleanText;
        r.moderation = 'pending';
        r.moderatedAt = null;
        r.moderatedBy = null;
        r.rejectReason = '';
        r.clientApprovalLastError = '';
        Store.save();
        const delivery = await window.ClientTextApprovals.sendReview(Store, r);
        if (!delivery.ok) toast(delivery.message, 'error');
        else if (delivery.telegramDelivered) toast('Исправленный текст отправлен клиенту');
        else toast('Исправленный текст добавлен в кабинет. Telegram пока не подключён');
        await refreshClientApprovals({ silent: true });
        return;
      }
      // Пересчитать зарплату/счётчики у сотрудника прямо сейчас
      // (иначе придётся ждать тика setInterval / обновления страницы).
      if (window.ReviewsSync && window.ReviewsSync.recompute) window.ReviewsSync.recompute();
      render();
    }

    document.getElementById('fStatus').addEventListener('change',  e => { filters.status = e.target.value; render(); });
    document.getElementById('fAuthor').addEventListener('change',  e => { filters.author = e.target.value; render(); });
    document.getElementById('fPeriod').addEventListener('change',  e => { filters.period = e.target.value; render(); });
    document.getElementById('fSearch').addEventListener('input',   e => { filters.q = e.target.value.trim().toLowerCase(); render(); });
    window.onGlobalSearch = q => { filters.q = q; document.getElementById('fSearch').value = q; render(); };

    window.addEventListener('cloudstate:updated', () => {
      Store.load();
      render();
      refreshClientApprovals({ silent: true });
    });

    render();
    refreshClientApprovals();
    window.setInterval(() => {
      if (document.visibilityState === 'visible') refreshClientApprovals({ silent: true });
    }, 30000);
  });
  </script>
</body>
</html>
