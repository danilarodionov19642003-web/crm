<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://mentori.tech https://*.supabase.co https://mentori-tg.rubicon1326.workers.dev https://*.lte-center.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b0b0c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mentori CRM"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=20260820"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=20260820"/>
  <link rel="manifest" href="/manifest.webmanifest?v=20260820"/>
  <title>Пульс кэша — Mentori CRM</title>
  <link rel="stylesheet" href="../css/styles.css?v=20260820b"/>
  <style>
    .pulse-kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:12px; }
    .pulse-kpi { min-width:0; padding:14px; border:1px solid var(--border); border-radius:8px; background:var(--bg-elev); }
    .pulse-kpi__label { color:var(--text-mute); font-size:10px; text-transform:uppercase; }
    .pulse-kpi__value { margin-top:7px; font-size:23px; line-height:1; font-weight:700; font-variant-numeric:tabular-nums; }
    .pulse-kpi__meta { margin-top:7px; color:var(--text-mute); font-size:11px; line-height:1.35; }
    .pulse-kpi.is-positive .pulse-kpi__value { color:#16a34a; }
    .pulse-kpi.is-negative .pulse-kpi__value { color:#dc2626; }
    .pulse-kpi.is-warning .pulse-kpi__value { color:#ea580c; }
    .balance-bar { display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg-elev); }
    .balance-bar__title { min-width:130px; font-size:13px; font-weight:600; }
    .balance-bar__meta { flex:1; color:var(--text-mute); font-size:11px; }
    .balance-bar__form { display:flex; align-items:center; gap:6px; }
    .balance-bar__form .input { width:145px; font-weight:700; font-variant-numeric:tabular-nums; }
    .pulse-tabs { display:flex; gap:4px; padding:3px; margin-bottom:12px; width:max-content; max-width:100%; overflow:auto; border:1px solid var(--border); border-radius:8px; background:var(--bg-elev); }
    .pulse-tab { border:0; border-radius:6px; padding:8px 14px; background:transparent; color:var(--text-mute); font:inherit; font-size:12px; font-weight:600; white-space:nowrap; cursor:pointer; }
    .pulse-tab.is-active { background:var(--accent); color:#fff; }
    .pulse-view[hidden] { display:none; }
    .pulse-panel { margin-bottom:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg-elev); overflow:hidden; }
    .pulse-panel__head { display:flex; align-items:center; gap:12px; min-height:46px; padding:10px 14px; border-bottom:1px solid var(--border); }
    .pulse-panel__head h2 { margin:0; font-size:14px; }
    .pulse-panel__meta { margin-left:auto; color:var(--text-mute); font-size:11px; text-align:right; }
    .pulse-table { width:100%; border-collapse:collapse; }
    .pulse-table th, .pulse-table td { padding:9px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:middle; font-size:12px; }
    .pulse-table th { color:var(--text-mute); font-size:10px; text-transform:uppercase; white-space:nowrap; }
    .pulse-table tr:last-child td { border-bottom:0; }
    .pulse-table .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .client-main { display:flex; align-items:center; gap:9px; min-width:160px; }
    .client-code { display:inline-flex; align-items:center; justify-content:center; min-width:38px; height:24px; padding:0 6px; border:1px solid rgba(255,122,0,.35); border-radius:6px; color:var(--accent); font-size:11px; font-weight:700; text-transform:uppercase; }
    .client-name { min-width:0; }
    .client-name strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .client-name span { display:block; margin-top:2px; color:var(--text-mute); font-size:10px; }
    .review-counts { white-space:nowrap; }
    .review-counts strong { font-variant-numeric:tabular-nums; }
    .review-counts span { color:var(--text-mute); font-size:10px; }
    .margin-pill { display:inline-flex; min-width:54px; justify-content:center; padding:4px 7px; border-radius:6px; font-weight:700; }
    .margin-pill.good { color:#15803d; background:rgba(34,197,94,.12); }
    .margin-pill.mid { color:#b45309; background:rgba(245,158,11,.14); }
    .margin-pill.bad { color:#b91c1c; background:rgba(239,68,68,.12); }
    .expand-button { width:30px; height:30px; padding:0; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--text); cursor:pointer; }
    .expand-button[aria-expanded="true"] { background:var(--bg); }
    .detail-row td { padding:0; background:var(--bg); }
    .client-detail { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--border); }
    .client-detail__cell { min-width:0; padding:12px 14px; background:var(--bg-elev); }
    .client-detail__title { margin-bottom:8px; color:var(--text-mute); font-size:10px; text-transform:uppercase; }
    .cost-line { display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:11px; }
    .cost-line strong { white-space:nowrap; font-variant-numeric:tabular-nums; }
    .cost-line.total { margin-top:4px; padding-top:7px; border-top:1px solid var(--border); font-weight:700; }
    .review-costs { grid-column:1/-1; padding:12px 14px 14px; background:var(--bg-elev); border-top:1px solid var(--border); }
    .review-costs__title { margin-bottom:8px; color:var(--text-mute); font-size:10px; text-transform:uppercase; }
    .review-costs .pulse-table th, .review-costs .pulse-table td { padding:6px 8px; font-size:11px; }
    .cost-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-bottom:1px solid var(--border); }
    .cost-block { min-width:0; padding:14px; border-right:1px solid var(--border); }
    .cost-block:last-child { border-right:0; }
    .cost-block__label { color:var(--text-mute); font-size:10px; text-transform:uppercase; }
    .cost-block__value { margin:7px 0 9px; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
    .warning-strip { padding:10px 14px; border-top:1px solid var(--border); color:#b45309; background:rgba(245,158,11,.08); font-size:11px; }
    .positive { color:#16a34a; }
    .negative { color:#dc2626; }
    .muted { color:var(--text-mute); }
    .empty { padding:36px 14px; text-align:center; color:var(--text-mute); }
    @media (max-width:1100px) {
      .pulse-kpis, .cost-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .cost-block:nth-child(2) { border-right:0; }
      .cost-block:nth-child(-n+2) { border-bottom:1px solid var(--border); }
      .client-detail { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:700px) {
      .pulse-kpis { grid-template-columns:1fr 1fr; gap:8px; }
      .pulse-kpi { padding:11px; }
      .pulse-kpi__value { font-size:19px; }
      .balance-bar { align-items:flex-start; flex-wrap:wrap; }
      .balance-bar__meta { flex-basis:calc(100% - 150px); }
      .balance-bar__form { width:100%; }
      .balance-bar__form .input { flex:1; width:auto; min-width:0; }
      .pulse-panel__head { align-items:flex-start; }
      .page-title > .btn { display:none; }
      .pulse-panel__meta { max-width:55%; }
      .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
      .pulse-table { min-width:820px; }
      .client-detail { grid-template-columns:1fr 1fr; min-width:690px; }
      .cost-grid { grid-template-columns:1fr; }
      .cost-block { border-right:0; border-bottom:1px solid var(--border); }
      .cost-block:last-child { border-bottom:0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div data-component="sidebar" data-active="finance-pulse"></div>
    <div class="main">
      <div data-component="header" data-title="Пульс кэша"></div>
      <main class="content">
        <div class="page-title">
          <div>
            <h1>Пульс кэша</h1>
            <p id="pulseUpdated">Расчёт загружается</p>
          </div>
          <a class="btn btn--ghost" href="finance.html">Финансы</a>
        </div>

        <section class="pulse-kpis" id="pulseKpis"></section>

        <section class="balance-bar">
          <div class="balance-bar__title">Сверить баланс</div>
          <div class="balance-bar__meta" id="balanceMeta"></div>
          <div class="balance-bar__form">
            <input class="input" type="number" id="balanceInput" min="0" step="100" aria-label="Фактический баланс"/>
            <button class="btn btn--primary" id="balanceSave">Сохранить</button>
          </div>
        </section>

        <nav class="pulse-tabs" aria-label="Разделы пульса">
          <button class="pulse-tab is-active" data-tab="clients">Клиенты</button>
          <button class="pulse-tab" data-tab="costs">Себестоимость</button>
        </nav>

        <section class="pulse-view" id="view-clients">
          <div class="pulse-panel">
            <div class="pulse-panel__head">
              <h2>Активные клиенты</h2>
              <div class="pulse-panel__meta" id="clientsMeta"></div>
            </div>
            <div class="table-scroll">
              <table class="pulse-table">
                <thead>
                  <tr>
                    <th>Клиент</th>
                    <th>Отзывы</th>
                    <th class="num">Получено</th>
                    <th class="num">Остаток</th>
                    <th class="num">Потрачено</th>
                    <th class="num">Прибыль</th>
                    <th class="num">Маржа</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="clientRows"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="pulse-view" id="view-costs" hidden>
          <div class="pulse-panel">
            <div class="pulse-panel__head">
              <h2>Фактическая себестоимость</h2>
              <div class="pulse-panel__meta" id="costMeta"></div>
            </div>
            <div class="cost-grid" id="costGrid"></div>
            <div class="warning-strip" id="costWarnings" hidden></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../data/seed.js"></script>
  <script src="../js/app.js?v=20260820i"></script>
  <script src="../js/economics.js?v=20260730b"></script>
  <script src="../js/supabase-client.js?v=20260820d"></script>
  <script src="../js/auth-gate.js?v=20260726a"></script>
  <script src="../js/cloud-sync.js?v=20260820d"></script>
  <script src="../js/accounts-sync.js"></script>
  <script src="../js/reviews-sync.js?v=20260717a"></script>
  <script src="../components/sidebar.js?v=20260820b"></script>
  <script src="../components/header.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const { Store, toast, fmtMoney, todayISO } = window.App;
    const expanded = new Set();
    let activeTab = 'clients';

    Store.load();

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      })[char]);
    }

    function money(value) {
      return fmtMoney(Math.round((Number(value) || 0) * 100) / 100);
    }

    function dateLabel(value) {
      if (!value) return '—';
      const parts = String(value).slice(0, 10).split('-');
      return parts.length === 3 ? `${parts[2]}.${parts[1]}` : value;
    }

    function marginClass(value) {
      if (value >= 30) return 'good';
      if (value >= 15) return 'mid';
      return 'bad';
    }

    function pricingLabel(row) {
      if (row.tariff === 'Поддержка' && (row.ordered !== 6 || (row.revenue > 0 && row.revenue !== 8290))) {
        return 'Индивидуальные условия';
      }
      return row.tariff || 'Индивидуальные условия';
    }

    function line(label, value, total) {
      return `<div class="cost-line${total ? ' total' : ''}"><span>${label}</span><strong>${money(value)}</strong></div>`;
    }

    function calculation() {
      return window.Economics.analyze(Store.state, { today: todayISO(), phoneUnitCost: 99 });
    }

    function renderKpis(data) {
      const values = [
        { label:'Кэш сейчас', value:data.cash.current, meta:data.cash.baseIso ? `сверено ${dateLabel(data.cash.baseDate)}` : 'баланс ещё не сверялся', cls:data.cash.current >= 0 ? '' : 'is-negative' },
        { label:'Прибыль за месяц', value:data.month.profit, meta:`доход ${money(data.month.income)} · расход ${money(data.month.businessExpense)}`, cls:data.month.profit >= 0 ? 'is-positive' : 'is-negative' },
        { label:'Затраты по клиентам', value:data.totals.actualCost, meta:'только уже понесённые расходы', cls:'' },
        { label:'Маржа на сегодня', value:data.totals.margin, meta:`выручка ${money(data.totals.revenue)} · ${Math.round(data.totals.marginPct)}%`, cls:data.totals.margin >= 0 ? 'is-positive' : 'is-negative' }
      ];
      document.getElementById('pulseKpis').innerHTML = values.map(item => `
        <div class="pulse-kpi ${item.cls}">
          <div class="pulse-kpi__label">${item.label}</div>
          <div class="pulse-kpi__value">${money(item.value)}</div>
          <div class="pulse-kpi__meta">${item.meta}</div>
        </div>`).join('');

      const delta = data.cash.incomeAfter - data.cash.expenseAfter;
      document.getElementById('balanceMeta').textContent = data.cash.baseIso
        ? `Подтверждено ${money(data.cash.confirmedBalance)}, после сверки ${delta >= 0 ? '+' : '−'} ${money(Math.abs(delta))}`
        : 'Введите фактический остаток на счетах и наличными';
      document.getElementById('balanceInput').value = Math.round(data.cash.current);
    }

    function detailHtml(row) {
      const reviewRows = row.reviewCosts.length
        ? row.reviewCosts.map(review => `
            <tr>
              <td><strong>${escapeHtml(review.profileCode || '—')}</strong>${review.archived ? ' <span class="muted">· архив</span>' : ''}</td>
              <td>${escapeHtml(review.performer)}</td>
              <td>${escapeHtml(review.status || '—')}</td>
              <td class="num">${money(review.software)}</td>
              <td class="num">${money(review.proxy)}</td>
              <td class="num">${money(review.phones)}</td>
              <td class="num">${money(review.salary)}</td>
              <td class="num"><strong>${money(review.total)}</strong></td>
            </tr>`).join('')
        : '<tr><td colspan="8" class="empty">Нет начатых отзывов</td></tr>';
      return `
        <div class="client-detail">
          <div class="client-detail__cell">
            <div class="client-detail__title">Фактически потрачено</div>
            ${line('Зарплата', row.actual.salary)}
            ${line('Номера', row.actual.phones)}
            ${line('Софт', row.actual.software)}
            ${line('Прокси', row.actual.proxy)}
            ${line('Итого', row.actual.total, true)}
          </div>
          <div class="client-detail__cell">
            <div class="client-detail__title">Деньги клиента</div>
            ${line('Получено', row.paid)}
            ${line('К получению', row.remain)}
            ${line('Полная выручка', row.revenue, true)}
          </div>
          <div class="client-detail__cell">
            <div class="client-detail__title">Результат на сегодня</div>
            ${line('Себестоимость по факту', row.totalCost)}
            ${line('На один начатый отзыв', row.actualCostPerStarted)}
            ${line('Прибыль по текущим затратам', row.margin, true)}
          </div>
          <div class="review-costs">
            <div class="review-costs__title">Себестоимость каждого начатого отзыва</div>
            <div class="table-scroll">
              <table class="pulse-table">
                <thead><tr><th>Аккаунт</th><th>Кто делал</th><th>Статус</th><th class="num">Софт</th><th class="num">Прокси</th><th class="num">Номер</th><th class="num">ЗП</th><th class="num">Итого</th></tr></thead>
                <tbody>${reviewRows}</tbody>
              </table>
            </div>
          </div>
        </div>`;
    }

    function renderClients(data) {
      document.getElementById('clientsMeta').textContent =
        `${data.totals.clients} клиентов · ${data.totals.done} готово · ${data.totals.inWork} в работе · ${data.totals.unassigned} не назначено`;
      const root = document.getElementById('clientRows');
      if (!data.clients.length) {
        root.innerHTML = '<tr><td colspan="8" class="empty">Нет активных заказов</td></tr>';
        return;
      }
      root.innerHTML = data.clients.map(row => {
        const open = expanded.has(row.id);
        return `
          <tr data-client="${escapeHtml(row.id)}">
            <td><div class="client-main"><span class="client-code">${escapeHtml(row.code || '—')}</span><div class="client-name"><strong>${escapeHtml(row.name || 'Без названия')}</strong><span>${escapeHtml(pricingLabel(row))}</span></div></div></td>
            <td><div class="review-counts"><strong>${row.done}</strong> / ${row.inWork} / ${row.unassigned}<br><span>готово / работа / свободно</span></div></td>
            <td class="num positive">${money(row.paid)}</td>
            <td class="num">${money(row.remain)}</td>
            <td class="num">${money(row.actual.total)}</td>
            <td class="num ${row.margin >= 0 ? 'positive' : 'negative'}"><strong>${money(row.margin)}</strong></td>
            <td class="num"><span class="margin-pill ${marginClass(row.marginPct)}">${Math.round(row.marginPct)}%</span></td>
            <td class="num"><button class="expand-button" data-expand="${escapeHtml(row.id)}" aria-expanded="${open}" title="Детали">${open ? '⌃' : '⌄'}</button></td>
          </tr>
          ${open ? `<tr class="detail-row"><td colspan="8">${detailHtml(row)}</td></tr>` : ''}`;
      }).join('');
      root.querySelectorAll('[data-expand]').forEach(button => button.addEventListener('click', () => {
        const id = button.dataset.expand;
        if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
        renderClients(calculation());
      }));
    }

    function costBlock(label, value, rows) {
      return `<div class="cost-block"><div class="cost-block__label">${label}</div><div class="cost-block__value">${money(value)}</div>${rows.join('')}</div>`;
    }

    function renderCosts(data) {
      const c = data.costs;
      const earned = [...c.labor.byPerformer.values()].reduce((sum, row) => sum + row.earned, 0);
      const paid = (Store.state.employees || []).reduce((sum, employee) => sum + (Number(employee.paid) || 0), 0);
      document.getElementById('costMeta').textContent = `по факту ${money(data.totals.actualCost)}`;
      document.getElementById('costGrid').innerHTML = [
        costBlock('Софт аккаунтов', c.software.total, [
          line('Разнесено по клиентам', c.software.allocated),
          line('Простой / без связи', c.software.idle + c.software.unallocated)
        ]),
        costBlock('Прокси аккаунтов', c.proxy.total, [
          line('Разнесено по клиентам', c.proxy.allocated),
          line('Простой / без связи', c.proxy.idle + c.proxy.unallocated)
        ]),
        costBlock('Номера', c.phones.linkedTotal + c.phones.historicalUnlinked, [
          line('Привязано к аккаунтам', c.phones.linkedTotal),
          line('Старая история без связи', c.phones.historicalUnlinked)
        ]),
        costBlock('Зарплата', earned, [
          line('Начислено', earned),
          line('Выплачено', paid),
          line('Долг', c.labor.debt)
        ])
      ].join('');

      const warnings = [];
      if (c.phones.historicalUnlinked > 0) warnings.push(`Старые покупки номеров без связи с аккаунтом: ${money(c.phones.historicalUnlinked)}. Они остаются общим расходом.`);
      if (data.warnings.overAssigned.length) warnings.push(`Заказов с лишним назначением: ${data.warnings.overAssigned.map(row => row.code).join(', ')}.`);
      const warningRoot = document.getElementById('costWarnings');
      warningRoot.hidden = warnings.length === 0;
      warningRoot.textContent = warnings.join(' ');
    }

    function render() {
      const data = calculation();
      renderKpis(data);
      renderClients(data);
      renderCosts(data);
      document.getElementById('pulseUpdated').textContent =
        `Активных клиентов: ${data.totals.clients}. Маржа по фактическим затратам: ${money(data.totals.margin)} (${Math.round(data.totals.marginPct)}%).`;
    }

    document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
      activeTab = button.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(item => item.classList.toggle('is-active', item.dataset.tab === activeTab));
      document.querySelectorAll('.pulse-view').forEach(view => { view.hidden = view.id !== `view-${activeTab}`; });
    }));

    document.getElementById('balanceSave').addEventListener('click', () => {
      const value = Number(document.getElementById('balanceInput').value);
      if (!Number.isFinite(value) || value < 0) {
        toast('Укажите корректный баланс', 'error');
        return;
      }
      Store.state.finance = Store.state.finance || {};
      Store.state.finance.balance = value;
      Store.state.finance.balanceUpdatedAt = new Date().toISOString();
      Store.save();
      toast('Баланс сверен');
      render();
    });

    window.addEventListener('store:reloaded', render);
    window.addEventListener('finance:updated', render);
    window.addEventListener('reviews:updated', render);
    render();
  });
  </script>
</body>
</html>
